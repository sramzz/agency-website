<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="740" viewBox="0 0 1000 740" role="img" aria-labelledby="title desc"><title id="title">Decide what the evidence supports</title><desc id="desc">Educational planning aid, not an automatic suitability score. Repair a failed contact route, unsupported important claim or missing required permission. Investigate a plausible audience or message question through a bounded test with a working contact route and agreed spending, owners and observations. Choose another priority when the creative work, audience evidence or response capacity is not yet practical. Keep unknowns visible. No campaign or results are represented; ordinary attribution does not establish additional sales caused by ads.</desc><rect width="100%" height="100%" fill="#f3f3f0"/><g font-family="Arial,sans-serif"><text x="32" y="43" font-size="16" fill="#575b64" font-weight="400">TIKTOK ADS · PLANNING AID</text><text x="32" y="95" font-size="36" fill="#15161b" font-weight="700">Decide what the evidence supports</text><text x="32" y="136" font-size="23" fill="#575b64" font-weight="400">A useful test starts with a question you can investigate.</text><rect x="32" y="180" width="304" height="350" fill="#ffffff" stroke="#bcbfc3"/><rect x="32" y="180" width="304" height="4" fill="#cc2447"/><text x="52" y="226" font-size="29" fill="#15161b" font-weight="700">Repair</text><text x="52" y="262" font-size="18" fill="#575b64" font-weight="400">Before promotion</text><text x="52" y="320" font-size="22" fill="#24252a" font-weight="400">Requests fail to arrive</text><text x="52" y="357" font-size="22" fill="#24252a" font-weight="400">An important claim</text><text x="52" y="394" font-size="22" fill="#24252a" font-weight="400">lacks support</text><text x="52" y="431" font-size="22" fill="#24252a" font-weight="400">Required permission</text><text x="52" y="468" font-size="22" fill="#24252a" font-weight="400">is missing</text><rect x="348" y="180" width="304" height="350" fill="#ffffff" stroke="#bcbfc3"/><rect x="348" y="180" width="304" height="4" fill="#cc2447"/><text x="368" y="226" font-size="29" fill="#15161b" font-weight="700">Investigate</text><text x="368" y="262" font-size="18" fill="#575b64" font-weight="400">Through a bounded test</text><text x="368" y="320" font-size="22" fill="#24252a" font-weight="400">Plausible audience or</text><text x="368" y="357" font-size="22" fill="#24252a" font-weight="400">message question</text><text x="368" y="394" font-size="22" fill="#24252a" font-weight="400">Working contact route</text><text x="368" y="431" font-size="22" fill="#24252a" font-weight="400">Agreed spend, owners</text><text x="368" y="468" font-size="22" fill="#24252a" font-weight="400">and observations</text><rect x="664" y="180" width="304" height="350" fill="#ffffff" stroke="#bcbfc3"/><rect x="664" y="180" width="304" height="4" fill="#cc2447"/><text x="684" y="226" font-size="29" fill="#15161b" font-weight="700">Change priority</text><text x="684" y="262" font-size="18" fill="#575b64" font-weight="400">When the work is not practical</text><text x="684" y="320" font-size="22" fill="#24252a" font-weight="400">Creative work,</text><text x="684" y="357" font-size="22" fill="#24252a" font-weight="400">audience evidence or</text><text x="684" y="394" font-size="22" fill="#24252a" font-weight="400">response capacity</text><text x="684" y="431" font-size="22" fill="#24252a" font-weight="400">is not practical yet</text><text x="32" y="583" font-size="23" fill="#24252a" font-weight="400">Keep unknowns visible. Record the reason, owner and next review.</text><text x="32" y="628" font-size="22" fill="#575b64" font-weight="400">These are planning options, not a validated suitability score.</text><text x="32" y="671" font-size="21" fill="#575b64" font-weight="400">No campaign or results represented. Ordinary attribution does not</text><text x="32" y="706" font-size="21" fill="#575b64" font-weight="400">establish additional sales caused by advertising.</text></g></svg>