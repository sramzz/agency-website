<svg xmlns="http://www.w3.org/2000/svg" width="540" height="1510" viewBox="0 0 540 1510" role="img" aria-labelledby="title desc"><title id="title">Decide what the evidence supports</title><desc id="desc">Educational planning aid, not an automatic suitability score. Repair a failed contact route, unsupported important claim or missing required permission. Investigate a plausible audience or message question through a bounded test with a working contact route and agreed spending, owners and observations. Choose another priority when the creative work, audience evidence or response capacity is not yet practical. Keep unknowns visible. No campaign or results are represented; ordinary attribution does not establish additional sales caused by ads.</desc><rect width="100%" height="100%" fill="#f3f3f0"/><g font-family="Arial,sans-serif"><text x="28" y="41" font-size="17" fill="#575b64" font-weight="400">TIKTOK ADS · PLANNING AID</text><text x="28" y="87" font-size="34" fill="#15161b" font-weight="700">Decide what the</text><text x="28" y="129" font-size="34" fill="#15161b" font-weight="700">evidence supports.</text><rect x="28" y="178" width="484" height="320" fill="#ffffff" stroke="#bcbfc3"/><rect x="28" y="178" width="484" height="4" fill="#cc2447"/><text x="52" y="226" font-size="32" fill="#15161b" font-weight="700">Repair</text><text x="52" y="266" font-size="23" fill="#575b64" font-weight="400">Before promotion</text><text x="52" y="318" font-size="24" fill="#24252a" font-weight="400">Requests fail to arrive</text><text x="52" y="352" font-size="24" fill="#24252a" font-weight="400">An important claim</text><text x="52" y="386" font-size="24" fill="#24252a" font-weight="400">lacks support</text><text x="52" y="420" font-size="24" fill="#24252a" font-weight="400">Required permission</text><text x="52" y="454" font-size="24" fill="#24252a" font-weight="400">is missing</text><rect x="28" y="528" width="484" height="320" fill="#ffffff" stroke="#bcbfc3"/><rect x="28" y="528" width="484" height="4" fill="#cc2447"/><text x="52" y="576" font-size="32" fill="#15161b" font-weight="700">Investigate</text><text x="52" y="616" font-size="23" fill="#575b64" font-weight="400">Through a bounded test</text><text x="52" y="668" font-size="24" fill="#24252a" font-weight="400">Plausible audience or</text><text x="52" y="702" font-size="24" fill="#24252a" font-weight="400">message question</text><text x="52" y="736" font-size="24" fill="#24252a" font-weight="400">Working contact route</text><text x="52" y="770" font-size="24" fill="#24252a" font-weight="400">Agreed spend, owners</text><text x="52" y="804" font-size="24" fill="#24252a" font-weight="400">and observations</text><rect x="28" y="878" width="484" height="320" fill="#ffffff" stroke="#bcbfc3"/><rect x="28" y="878" width="484" height="4" fill="#cc2447"/><text x="52" y="926" font-size="32" fill="#15161b" font-weight="700">Change priority</text><text x="52" y="966" font-size="23" fill="#575b64" font-weight="400">When the work is not practical</text><text x="52" y="1018" font-size="24" fill="#24252a" font-weight="400">Creative work,</text><text x="52" y="1052" font-size="24" fill="#24252a" font-weight="400">audience evidence or</text><text x="52" y="1086" font-size="24" fill="#24252a" font-weight="400">response capacity</text><text x="52" y="1120" font-size="24" fill="#24252a" font-weight="400">is not practical yet</text><text x="28" y="1266" font-size="23" fill="#24252a" font-weight="400">Keep unknowns visible. Record the</text><text x="28" y="1302" font-size="23" fill="#24252a" font-weight="400">reason, owner and next review.</text><text x="28" y="1351" font-size="22" fill="#575b64" font-weight="400">Planning options, not a validated score.</text><text x="28" y="1398" font-size="22" fill="#575b64" font-weight="400">No campaign or results represented.</text><text x="28" y="1444" font-size="22" fill="#575b64" font-weight="400">Ordinary attribution does not establish</text><text x="28" y="1480" font-size="22" fill="#575b64" font-weight="400">additional sales caused by advertising.</text></g></svg>