<svg xmlns="http://www.w3.org/2000/svg" width="540" height="1350" viewBox="0 0 540 1350" role="img" aria-labelledby="title desc"><title id="title">From a search to a recorded customer</title><desc id="desc">Seven separate stages: search, eligibility and auction, ad, page or call, received enquiry, qualified enquiry and customer. Each requires different evidence. The route is educational and does not guarantee progress or profit.</desc><rect width="540" height="1350" fill="#f2f1eb"/><g font-family="Arial, sans-serif" fill="#171b21"><text x="34" y="43" font-size="13" letter-spacing="2" fill="#b51c38">GOOGLE SEARCH ADS / THE ENQUIRY ROUTE</text><text x="34" y="84" font-size="25" font-weight="700">Different stages. Different evidence.</text><g fill="none" stroke="#b51c38" stroke-width="2.5"><path d="M270 265v19"/><path d="M270 418v19"/><path d="M270 571v19"/><path d="M270 724v19"/><path d="M270 877v19"/><path d="M270 1030v19"/></g><g transform="translate(34 135)"><rect width="472" height="126" rx="5" fill="#fffefa" stroke="#c7c6c0"/><rect width="472" height="5" fill="#252a30"/><text x="18" y="35" class="number">01</text><text x="18" y="68" font-size="24" font-weight="700">Search</text><text x="18" y="94" font-size="19">A possible service need</text><text x="18" y="116" font-size="17" fill="#53606c">Intent still needs checking</text></g><g transform="translate(34 288)"><rect width="472" height="126" rx="5" fill="#fffefa" stroke="#c7c6c0"/><rect width="472" height="5" fill="#252a30"/><text x="18" y="35" class="number">02</text><text x="18" y="68" font-size="24" font-weight="700">Eligibility + auction</text><text x="18" y="94" font-size="19">Whether the ad can appear</text><text x="18" y="116" font-size="17" fill="#53606c">Bid, quality and context</text></g><g transform="translate(34 441)"><rect width="472" height="126" rx="5" fill="#fffefa" stroke="#c7c6c0"/><rect width="472" height="5" fill="#252a30"/><text x="18" y="35" class="number">03</text><text x="18" y="68" font-size="24" font-weight="700">Ad</text><text x="18" y="94" font-size="19">A truthful service promise</text><text x="18" y="116" font-size="17" fill="#53606c">Relevant work and coverage</text></g><g transform="translate(34 594)"><rect width="472" height="126" rx="5" fill="#fffefa" stroke="#c7c6c0"/><rect width="472" height="5" fill="#252a30"/><text x="18" y="35" class="number">04</text><text x="18" y="68" font-size="24" font-weight="700">Page or call</text><text x="18" y="94" font-size="19">A usable contact route</text><text x="18" y="116" font-size="17" fill="#53606c">Clear scope and next step</text></g><g transform="translate(34 747)"><rect width="472" height="126" rx="5" fill="#fffefa" stroke="#c7c6c0"/><rect width="472" height="5" fill="#b51c38"/><text x="18" y="35" class="number">05</text><text x="18" y="68" font-size="24" font-weight="700">Received enquiry</text><text x="18" y="94" font-size="19">Contact actually received</text><text x="18" y="116" font-size="17" fill="#53606c">Record and response owner</text></g><g transform="translate(34 900)"><rect width="472" height="126" rx="5" fill="#fffefa" stroke="#c7c6c0"/><rect width="472" height="5" fill="#b51c38"/><text x="18" y="35" class="number">06</text><text x="18" y="68" font-size="24" font-weight="700">Qualified enquiry</text><text x="18" y="94" font-size="19">Fit assessed consistently</text><text x="18" y="116" font-size="17" fill="#53606c">Service, address and scope</text></g><g transform="translate(34 1053)"><rect width="472" height="126" rx="5" fill="#fffefa" stroke="#c7c6c0"/><rect width="472" height="5" fill="#b51c38"/><text x="18" y="35" class="number">07</text><text x="18" y="68" font-size="24" font-weight="700">Customer</text><text x="18" y="94" font-size="19">Won work recorded</text><text x="18" y="116" font-size="17" fill="#53606c">Economics still need review</text></g><text x="34" y="1292" font-size="17" fill="#53606c">A click creates an opportunity to respond.</text><text x="34" y="1319" font-size="16" fill="#53606c">These checks do not guarantee an enquiry, customer or profit.</text></g><style>.number{font-size:13px;fill:#b51c38;letter-spacing:1px}</style></svg>