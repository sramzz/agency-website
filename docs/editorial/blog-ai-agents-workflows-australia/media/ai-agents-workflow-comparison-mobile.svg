<svg xmlns="http://www.w3.org/2000/svg" width="540" height="1250" viewBox="0 0 540 1250" role="img" aria-labelledby="title desc"><title id="title">One enquiry, two possible routes</title><desc id="desc">In a hypothetical Brisbane cleaning business, a request is missing floor area and access details. A fixed workflow extracts and checks details in a planned sequence. An agent can choose authorised site notes or service documents and use the results to decide its next check. Both prepare a brief with facts, sources and missing questions. The estimator retains prices and commitments.</desc><defs><marker id="red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10" fill="#ff304f"/></marker><marker id="grey" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10" fill="#94a3b8"/></marker></defs><g font-family="Arial, sans-serif"><rect x="1" y="1" width="538" height="1248" rx="12" fill="#0c1017" stroke="#343944"/><text x="32" y="43" font-size="15" fill="#ff304f" font-weight="700" text-anchor="start">ONE ENQUIRY. TWO POSSIBLE ROUTES.</text><text x="32" y="89" font-size="34" fill="#f8fafc" font-weight="700" text-anchor="start">Which parts need a choice?</text><text x="32" y="123" font-size="21" fill="#94a3b8" font-weight="400" text-anchor="start">Brisbane cleaning example · hypothetical</text><rect x="28" y="151" width="484" height="116" rx="8" stroke="#ff304f" fill="#121823"/><text x="48" y="184" font-size="25" fill="#f8fafc" font-weight="700" text-anchor="start">Cleaning three evenings a week</text><text x="48" y="218" font-size="23" fill="#94a3b8" font-weight="400" text-anchor="start">Known: suburb and office type.</text><text x="48" y="249" font-size="23" fill="#94a3b8" font-weight="400" text-anchor="start">Missing: floor area and access.</text><path d="M270 267 V287 H22 V766" fill="none" stroke="#ff304f" stroke-width="2.5"/><path d="M22 428 H54" fill="none" stroke="#ff304f" stroke-width="2.5" marker-end="url(#red)"/><path d="M22 766 H54" fill="none" stroke="#ff304f" stroke-width="2.5" marker-end="url(#red)"/><rect x="60" y="311" width="448" height="260" rx="8" stroke="#343944" fill="#121823"/><text x="82" y="344" font-size="17" fill="#ff304f" font-weight="700" text-anchor="start">A / WORKFLOW WITH AI</text><text x="82" y="385" font-size="30" fill="#f8fafc" font-weight="700" text-anchor="start">Steps set in advance</text><text x="82" y="429" font-size="18" fill="#ff304f" font-weight="700" text-anchor="start">1</text><text x="109" y="429" font-size="21" fill="#f8fafc" font-weight="400" text-anchor="start">Extract the email details</text><text x="82" y="472" font-size="18" fill="#ff304f" font-weight="700" text-anchor="start">2</text><text x="109" y="472" font-size="21" fill="#f8fafc" font-weight="400" text-anchor="start">Check fields and customer match</text><text x="82" y="515" font-size="18" fill="#ff304f" font-weight="700" text-anchor="start">3</text><text x="109" y="515" font-size="21" fill="#f8fafc" font-weight="400" text-anchor="start">Prepare brief and missing questions</text><text x="82" y="550" font-size="21" fill="#94a3b8" font-weight="400" text-anchor="start">AI interprets within a defined route.</text><rect x="60" y="609" width="448" height="337" rx="8" stroke="#343944" fill="#121823"/><text x="82" y="642" font-size="17" fill="#ff304f" font-weight="700" text-anchor="start">B / AI AGENT</text><text x="82" y="683" font-size="29" fill="#f8fafc" font-weight="700" text-anchor="start">Chooses permitted research</text><rect x="82" y="707" width="404" height="50" rx="8" stroke="#94a3b8" fill="#121823"/><text x="284" y="739" font-size="23" fill="#f8fafc" font-weight="500" text-anchor="middle">What information is needed?</text><path d="M284 757 V774 H178 V791" fill="none" stroke="#ff304f" stroke-width="2.5" marker-end="url(#red)"/><path d="M284 774 H390 V791" fill="none" stroke="#ff304f" stroke-width="2.5" marker-end="url(#red)"/><rect x="82" y="795" width="192" height="70" rx="8" stroke="#343944" fill="#121823"/><rect x="290" y="795" width="196" height="70" rx="8" stroke="#343944" fill="#121823"/><text x="178" y="824" font-size="23" fill="#f8fafc" font-weight="500" text-anchor="middle">Customer</text><text x="178" y="852" font-size="23" fill="#f8fafc" font-weight="500" text-anchor="middle">site notes</text><text x="388" y="824" font-size="23" fill="#f8fafc" font-weight="500" text-anchor="middle">Approved</text><text x="388" y="852" font-size="23" fill="#f8fafc" font-weight="500" text-anchor="middle">service docs</text><path d="M486 831 H496 V732 H489" fill="none" stroke="#94a3b8" stroke-width="2.5" marker-end="url(#grey)"/><text x="82" y="901" font-size="21" fill="#94a3b8" font-weight="400" text-anchor="start">Uses results to choose the next check.</text><text x="82" y="929" font-size="21" fill="#94a3b8" font-weight="400" text-anchor="start">Only within authorised sources.</text><path d="M508 442 H524 V983 H284" fill="none" stroke="#ff304f" stroke-width="2.5"/><path d="M508 813 H524" fill="none" stroke="#ff304f" stroke-width="2.5"/><path d="M284 983 V1002" fill="none" stroke="#ff304f" stroke-width="2.5" marker-end="url(#red)"/><rect x="28" y="1007" width="484" height="116" rx="8" stroke="#ff304f" fill="#121823"/><text x="270" y="1044" font-size="27" fill="#f8fafc" font-weight="700" text-anchor="middle">A brief the estimator can check</text><text x="270" y="1079" font-size="23" fill="#94a3b8" font-weight="400" text-anchor="middle">Known facts · sources</text><text x="270" y="1108" font-size="23" fill="#94a3b8" font-weight="400" text-anchor="middle">Missing questions</text><text x="270" y="1171" font-size="25" fill="#f8fafc" font-weight="500" text-anchor="middle">The estimator retains prices</text><text x="270" y="1204" font-size="25" fill="#f8fafc" font-weight="500" text-anchor="middle">and commitments.</text></g></svg>
