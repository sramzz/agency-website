<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="820" viewBox="0 0 1000 820" role="img" aria-labelledby="title desc"><title id="title">One enquiry, two possible routes</title><desc id="desc">In a hypothetical Brisbane cleaning business, a request is missing floor area and access details. A fixed workflow extracts and checks details in a planned sequence. An agent can choose authorised site notes or service documents and use the results to decide its next check. Both prepare a brief with facts, sources and missing questions. The estimator retains prices and commitments.</desc><defs><marker id="red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10" fill="#ff304f"/></marker><marker id="grey" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10" fill="#94a3b8"/></marker></defs><g font-family="Arial, sans-serif"><rect x="1" y="1" width="998" height="818" rx="12" fill="#0c1017" stroke="#343944"/><text x="32" y="43" font-size="14" fill="#ff304f" font-weight="700" text-anchor="start">ONE ENQUIRY. TWO POSSIBLE ROUTES.</text><text x="32" y="89" font-size="36" fill="#f8fafc" font-weight="700" text-anchor="start">Which parts need a choice?</text><text x="32" y="121" font-size="20" fill="#94a3b8" font-weight="400" text-anchor="start">Brisbane cleaning example · hypothetical</text><rect x="32" y="147" width="936" height="78" rx="8" stroke="#ff304f" fill="#121823"/><text x="54" y="178" font-size="24" fill="#f8fafc" font-weight="700" text-anchor="start">Cleaning requested three evenings a week</text><text x="54" y="207" font-size="20" fill="#94a3b8" font-weight="400" text-anchor="start">Known: suburb and office type. Missing: floor area and access.</text><path d="M500 225 V244 H254 V266" fill="none" stroke="#ff304f" stroke-width="2.5" marker-end="url(#red)"/><path d="M500 244 H746 V266" fill="none" stroke="#ff304f" stroke-width="2.5" marker-end="url(#red)"/><rect x="32" y="270" width="444" height="338" rx="8" stroke="#343944" fill="#121823"/><rect x="524" y="270" width="444" height="338" rx="8" stroke="#343944" fill="#121823"/><text x="54" y="301" font-size="15" fill="#ff304f" font-weight="700" text-anchor="start">A / WORKFLOW WITH AI</text><text x="54" y="338" font-size="27" fill="#f8fafc" font-weight="700" text-anchor="start">Steps set in advance</text><text x="54" y="386" font-size="16" fill="#ff304f" font-weight="700" text-anchor="start">01</text><text x="91" y="386" font-size="20" fill="#f8fafc" font-weight="400" text-anchor="start">Extract the email details</text><path d="M65 396 V428" fill="none" stroke="#94a3b8" stroke-width="2.5" marker-end="url(#grey)"/><text x="54" y="456" font-size="16" fill="#ff304f" font-weight="700" text-anchor="start">02</text><text x="91" y="456" font-size="20" fill="#f8fafc" font-weight="400" text-anchor="start">Check fields and customer match</text><path d="M65 466 V498" fill="none" stroke="#94a3b8" stroke-width="2.5" marker-end="url(#grey)"/><text x="54" y="526" font-size="16" fill="#ff304f" font-weight="700" text-anchor="start">03</text><text x="91" y="526" font-size="20" fill="#f8fafc" font-weight="400" text-anchor="start">Prepare brief and missing questions</text><text x="54" y="580" font-size="19" fill="#94a3b8" font-weight="400" text-anchor="start">AI interprets. The route stays defined.</text><text x="546" y="301" font-size="15" fill="#ff304f" font-weight="700" text-anchor="start">B / AI AGENT</text><text x="546" y="338" font-size="27" fill="#f8fafc" font-weight="700" text-anchor="start">Chooses permitted research</text><rect x="552" y="362" width="388" height="52" rx="8" stroke="#94a3b8" fill="#121823"/><text x="746" y="394" font-size="21" fill="#f8fafc" font-weight="500" text-anchor="middle">What information is needed?</text><path d="M746 414 V430 H649 V446" fill="none" stroke="#ff304f" stroke-width="2.5" marker-end="url(#red)"/><path d="M746 430 H846 V446" fill="none" stroke="#ff304f" stroke-width="2.5" marker-end="url(#red)"/><rect x="552" y="450" width="186" height="69" rx="8" stroke="#343944" fill="#121823"/><rect x="754" y="450" width="186" height="69" rx="8" stroke="#343944" fill="#121823"/><text x="645" y="478" font-size="20" fill="#f8fafc" font-weight="500" text-anchor="middle">Customer</text><text x="645" y="504" font-size="20" fill="#f8fafc" font-weight="500" text-anchor="middle">site notes</text><text x="847" y="478" font-size="20" fill="#f8fafc" font-weight="500" text-anchor="middle">Approved</text><text x="847" y="504" font-size="20" fill="#f8fafc" font-weight="500" text-anchor="middle">service documents</text><path d="M940 484 H952 V388 H943" fill="none" stroke="#94a3b8" stroke-width="2.5" marker-end="url(#grey)"/><text x="546" y="556" font-size="20" fill="#94a3b8" font-weight="400" text-anchor="start">Uses results to choose the next check.</text><text x="546" y="584" font-size="19" fill="#94a3b8" font-weight="400" text-anchor="start">Only within authorised sources.</text><path d="M254 608 V635 H500 V659" fill="none" stroke="#ff304f" stroke-width="2.5" marker-end="url(#red)"/><path d="M746 608 V635 H500" fill="none" stroke="#ff304f" stroke-width="2.5" marker-end="url(#red)"/><rect x="138" y="663" width="724" height="82" rx="8" stroke="#ff304f" fill="#121823"/><text x="500" y="695" font-size="26" fill="#f8fafc" font-weight="700" text-anchor="middle">A brief the estimator can check</text><text x="500" y="725" font-size="21" fill="#94a3b8" font-weight="400" text-anchor="middle">Known facts · sources · missing questions</text><text x="500" y="789" font-size="22" fill="#f8fafc" font-weight="500" text-anchor="middle">The estimator retains prices and commitments.</text></g></svg>
