<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1110" viewBox="0 0 1000 1110" role="img" aria-labelledby="title desc"><title id="title">Timeout: check before repeating</title><desc id="desc">Fictional teaching premises, not observed results. The source and trigger contain enquiry E104; contact C42 is linked. Opportunity creation timed out, leaving the write uncertain. The follow-up task was not attempted. Investigate the destination, current owner, manual actions and pending retries. A later premise establishes that opportunity O104 already exists for E104: preserve the confirmed relationship and address only the missing task if still needed through a supported recovery method. If the opportunity cannot be established, keep the write uncertain and refer it to the owner. A blank search does not prove that creating again is safe. E105 is a separate legitimate enquiry from the same contact. No recovery has been executed.</desc><rect width="100%" height="100%" fill="#101318"/><g font-family="Arial,sans-serif"><text x="40" y="43" font-size="16" fill="#c0c6cf" font-weight="400">FICTIONAL E104 · TEACHING PREMISES</text><text x="40" y="96" font-size="36" fill="#fafaf7" font-weight="700">Timeout: check before repeating</text><text x="40" y="140" font-size="23" fill="#e5e7eb" font-weight="400">A missing response does not prove that nothing was saved.</text><rect x="40" y="182" width="445" height="128" fill="#1b2027" stroke="#59616d"/><text x="64" y="220" font-size="17" fill="#c0c6cf" font-weight="400">SOURCE / TRIGGER</text><text x="64" y="260" font-size="28" fill="#fafaf7" font-weight="700">E104 received</text><text x="64" y="293" font-size="21" fill="#e5e7eb" font-weight="400">Receipt established in this scenario.</text><rect x="515" y="182" width="445" height="128" fill="#1b2027" stroke="#59616d"/><text x="539" y="220" font-size="17" fill="#c0c6cf" font-weight="400">CONTACT</text><text x="539" y="260" font-size="28" fill="#fafaf7" font-weight="700">C42 correctly linked</text><text x="539" y="293" font-size="21" fill="#e5e7eb" font-weight="400">The opportunity is separate work.</text><rect x="40" y="338" width="445" height="153" fill="#1b2027" stroke="#59616d"/><text x="64" y="376" font-size="17" fill="#f24563" font-weight="400">OPPORTUNITY</text><text x="64" y="416" font-size="28" fill="#fafaf7" font-weight="700">Write uncertain</text><text x="64" y="456" font-size="21" fill="#e5e7eb" font-weight="400">Request timed out; inspect the CRM.</text><rect x="515" y="338" width="445" height="153" fill="#1b2027" stroke="#59616d"/><text x="539" y="376" font-size="17" fill="#c0c6cf" font-weight="400">FOLLOW-UP TASK</text><text x="539" y="416" font-size="28" fill="#fafaf7" font-weight="700">Not attempted</text><text x="539" y="456" font-size="21" fill="#e5e7eb" font-weight="400">The workflow did not reach this step.</text><rect x="40" y="520" width="920" height="136" fill="#1b2027" stroke="#59616d"/><text x="64" y="561" font-size="28" fill="#fafaf7" font-weight="700">Investigate before another attempt</text><text x="64" y="600" font-size="23" fill="#e5e7eb" font-weight="400">Check destination references and relationships, current ownership,</text><text x="64" y="634" font-size="23" fill="#e5e7eb" font-weight="400">manual handling, pending retries and the supported recovery method.</text><rect x="40" y="685" width="445" height="248" fill="#1b2027" stroke="#59616d"/><text x="64" y="723" font-size="17" fill="#c0c6cf" font-weight="400">LATER TEACHING PREMISE</text><text x="64" y="764" font-size="28" fill="#fafaf7" font-weight="700">O104 already exists</text><text x="64" y="805" font-size="22" fill="#e5e7eb" font-weight="400">Preserve the confirmed relationship.</text><text x="64" y="841" font-size="22" fill="#e5e7eb" font-weight="400">Address only the missing task</text><text x="64" y="877" font-size="22" fill="#e5e7eb" font-weight="400">if current-state checks show it is</text><text x="64" y="913" font-size="22" fill="#e5e7eb" font-weight="400">still needed. No recovery executed.</text><rect x="515" y="685" width="445" height="248" fill="#1b2027" stroke="#59616d"/><text x="539" y="723" font-size="16" fill="#f24563" font-weight="400">IF THE RESULT CANNOT BE ESTABLISHED</text><text x="539" y="764" font-size="28" fill="#fafaf7" font-weight="700">Keep it uncertain</text><text x="539" y="805" font-size="22" fill="#e5e7eb" font-weight="400">Refer it to the responsible owner.</text><text x="539" y="841" font-size="22" fill="#e5e7eb" font-weight="400">A blank search does not establish</text><text x="539" y="877" font-size="22" fill="#e5e7eb" font-weight="400">that creating another record is safe.</text><text x="40" y="986" font-size="23" fill="#e5e7eb" font-weight="400">E105 can be a separate enquiry from the same contact C42.</text><text x="40" y="1028" font-size="23" fill="#e5e7eb" font-weight="400">Identify the enquiry and action, not just the person.</text><text x="40" y="1075" font-size="22" fill="#c0c6cf" font-weight="400">Proposed investigation and recovery are different from observed results.</text></g></svg>