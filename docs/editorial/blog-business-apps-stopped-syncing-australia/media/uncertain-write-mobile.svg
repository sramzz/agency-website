<svg xmlns="http://www.w3.org/2000/svg" width="540" height="1795" viewBox="0 0 540 1795" role="img" aria-labelledby="title desc"><title id="title">Timeout: check before repeating</title><desc id="desc">Fictional teaching premises, not observed results. The source and trigger contain enquiry E104; contact C42 is linked. Opportunity creation timed out, leaving the write uncertain. The follow-up task was not attempted. Investigate the destination, current owner, manual actions and pending retries. A later premise establishes that opportunity O104 already exists for E104: preserve the confirmed relationship and address only the missing task if still needed through a supported recovery method. If the opportunity cannot be established, keep the write uncertain and refer it to the owner. A blank search does not prove that creating again is safe. E105 is a separate legitimate enquiry from the same contact. No recovery has been executed.</desc><rect width="100%" height="100%" fill="#101318"/><g font-family="Arial,sans-serif"><text x="28" y="40" font-size="16" fill="#c0c6cf" font-weight="400">FICTIONAL E104 · TEACHING PREMISES</text><text x="28" y="88" font-size="35" fill="#fafaf7" font-weight="700">Timeout: check</text><text x="28" y="133" font-size="35" fill="#fafaf7" font-weight="700">before repeating.</text><rect x="28" y="170" width="484" height="164" fill="#1b2027" stroke="#59616d"/><text x="52" y="206" font-size="17" fill="#c0c6cf" font-weight="400">SOURCE / TRIGGER</text><text x="52" y="249" font-size="28" fill="#fafaf7" font-weight="700">E104 received</text><text x="52" y="288" font-size="23" fill="#e5e7eb" font-weight="400">Receipt established in this scenario.</text><rect x="28" y="354" width="484" height="164" fill="#1b2027" stroke="#59616d"/><text x="52" y="390" font-size="17" fill="#c0c6cf" font-weight="400">CONTACT</text><text x="52" y="433" font-size="28" fill="#fafaf7" font-weight="700">C42 correctly linked</text><text x="52" y="472" font-size="23" fill="#e5e7eb" font-weight="400">The opportunity is separate work.</text><rect x="28" y="538" width="484" height="188" fill="#1b2027" stroke="#59616d"/><text x="52" y="574" font-size="17" fill="#f24563" font-weight="400">OPPORTUNITY</text><text x="52" y="617" font-size="28" fill="#fafaf7" font-weight="700">Write uncertain</text><text x="52" y="656" font-size="23" fill="#e5e7eb" font-weight="400">Request timed out.</text><text x="52" y="690" font-size="23" fill="#e5e7eb" font-weight="400">Inspect the CRM before repeating.</text><rect x="28" y="746" width="484" height="164" fill="#1b2027" stroke="#59616d"/><text x="52" y="782" font-size="17" fill="#c0c6cf" font-weight="400">FOLLOW-UP TASK</text><text x="52" y="825" font-size="28" fill="#fafaf7" font-weight="700">Not attempted</text><text x="52" y="864" font-size="23" fill="#e5e7eb" font-weight="400">This step was not reached.</text><rect x="28" y="930" width="484" height="222" fill="#1b2027" stroke="#59616d"/><text x="52" y="966" font-size="17" fill="#c0c6cf" font-weight="400">INVESTIGATE</text><text x="52" y="1009" font-size="28" fill="#fafaf7" font-weight="700">Check the current state</text><text x="52" y="1048" font-size="23" fill="#e5e7eb" font-weight="400">Destination and relationships;</text><text x="52" y="1082" font-size="23" fill="#e5e7eb" font-weight="400">owner and manual handling;</text><text x="52" y="1116" font-size="23" fill="#e5e7eb" font-weight="400">pending retries and recovery method.</text><rect x="28" y="1172" width="484" height="256" fill="#1b2027" stroke="#59616d"/><text x="52" y="1208" font-size="17" fill="#c0c6cf" font-weight="400">LATER TEACHING PREMISE</text><text x="52" y="1251" font-size="28" fill="#fafaf7" font-weight="700">O104 already exists</text><text x="52" y="1290" font-size="23" fill="#e5e7eb" font-weight="400">Preserve the confirmed relationship.</text><text x="52" y="1324" font-size="23" fill="#e5e7eb" font-weight="400">Address only the missing task,</text><text x="52" y="1358" font-size="23" fill="#e5e7eb" font-weight="400">if current checks show it is needed.</text><text x="52" y="1392" font-size="23" fill="#e5e7eb" font-weight="400">No recovery has been executed.</text><rect x="28" y="1448" width="484" height="188" fill="#1b2027" stroke="#59616d"/><text x="52" y="1484" font-size="17" fill="#f24563" font-weight="400">IF IT CANNOT BE ESTABLISHED</text><text x="52" y="1527" font-size="28" fill="#fafaf7" font-weight="700">Keep it uncertain</text><text x="52" y="1566" font-size="23" fill="#e5e7eb" font-weight="400">Refer it to the responsible owner.</text><text x="52" y="1600" font-size="23" fill="#e5e7eb" font-weight="400">A blank search is not proof of safety.</text><text x="28" y="1682" font-size="22" fill="#e5e7eb" font-weight="400">E105 can be another enquiry from C42.</text><text x="28" y="1722" font-size="22" fill="#e5e7eb" font-weight="400">Identify the enquiry, not just the person.</text><text x="28" y="1765" font-size="22" fill="#c0c6cf" font-weight="400">Teaching premises, not observed results.</text></g></svg>