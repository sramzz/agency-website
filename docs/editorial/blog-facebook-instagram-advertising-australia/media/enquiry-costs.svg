<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="700" viewBox="0 0 1000 700" role="img" aria-labelledby="title desc"><title id="title">When a cheaper enquiry costs more after qualification</title><desc id="desc">Hypothetical non-overlapping groups, each with AUD 1,200 media spend, excluding GST. X: 60 received, 6 qualified, AUD 20 per received and AUD 200 per qualified enquiry. Y: 20 received, 8 qualified, AUD 60 per received and AUD 150 per qualified enquiry. Same qualification criteria, all assessed, no pending cases. This is not an A/B test or evidence of profit or cause.</desc><rect width="100%" height="100%" fill="#11151a"/><g font-family="Arial,sans-serif" fill="#f7f6f2"><text x="42" y="44" font-size="16" letter-spacing="1.5" fill="#c4c7cd">HYPOTHETICAL · AUD · EXCLUDING GST</text><text x="42" y="93" font-size="34" font-weight="700">The definition changes the cost.</text><text x="42" y="131" font-size="20" fill="#c4c7cd">Each group has AUD 1,200 of media spend.</text><rect x="42" y="164" width="446" height="376" rx="0" fill="#1b2129"/><rect x="42" y="164" width="446" height="4" fill="#ce2145"/><text x="66" y="206" font-size="18" letter-spacing="1.3">ILLUSTRATION X</text><text x="66" y="259" font-size="32" font-weight="700">60 received / 6 qualified</text><text x="66" y="295" font-size="20" fill="#c4c7cd">Qualification rate: 10%</text><path d="M66 321H464" stroke="#4a535f"/><text x="66" y="361" font-size="19" fill="#c4c7cd">Media cost per received enquiry</text><text x="66" y="404" font-size="31" font-weight="700">AUD 20</text><text x="66" y="449" font-size="19" fill="#c4c7cd">Media cost per qualified enquiry</text><text x="66" y="493" font-size="31" font-weight="700">AUD 200</text><rect x="512" y="164" width="446" height="376" rx="0" fill="#1b2129"/><rect x="512" y="164" width="446" height="4" fill="#ce2145"/><text x="536" y="206" font-size="18" letter-spacing="1.3">ILLUSTRATION Y</text><text x="536" y="259" font-size="32" font-weight="700">20 received / 8 qualified</text><text x="536" y="295" font-size="20" fill="#c4c7cd">Qualification rate: 40%</text><path d="M536 321H934" stroke="#4a535f"/><text x="536" y="361" font-size="19" fill="#c4c7cd">Media cost per received enquiry</text><text x="536" y="404" font-size="31" font-weight="700">AUD 60</text><text x="536" y="449" font-size="19" fill="#c4c7cd">Media cost per qualified enquiry</text><text x="536" y="493" font-size="31" font-weight="700">AUD 150</text><text x="42" y="581" font-size="20" fill="#c4c7cd">Same criteria. All assessed. No pending cases.</text><text x="42" y="620" font-size="22" font-weight="700">A lower first cost does not settle the business result.</text><text x="42" y="659" font-size="19" fill="#c4c7cd">Not an A/B test, profit calculation or proof of what caused the difference.</text></g></svg>