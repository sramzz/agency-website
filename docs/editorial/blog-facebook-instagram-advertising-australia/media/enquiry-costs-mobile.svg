<svg xmlns="http://www.w3.org/2000/svg" width="540" height="1230" viewBox="0 0 540 1230" role="img" aria-labelledby="title desc"><title id="title">When a cheaper enquiry costs more after qualification</title><desc id="desc">Hypothetical non-overlapping groups, each with AUD 1,200 media spend, excluding GST. X: 60 received, 6 qualified, AUD 20 per received and AUD 200 per qualified enquiry. Y: 20 received, 8 qualified, AUD 60 per received and AUD 150 per qualified enquiry. Same qualification criteria, all assessed, no pending cases. This is not an A/B test or evidence of profit or cause.</desc><rect width="100%" height="100%" fill="#11151a"/><g font-family="Arial,sans-serif" fill="#f7f6f2"><text x="28" y="40" font-size="17" letter-spacing="1" fill="#c4c7cd">HYPOTHETICAL · AUD · EX GST</text><text x="28" y="87" font-size="31" font-weight="700">The definition changes</text><text x="28" y="126" font-size="31" font-weight="700">the cost.</text><text x="28" y="165" font-size="22" fill="#c4c7cd">AUD 1,200 media spend each.</text><rect x="28" y="200" width="484" height="370" fill="#1b2129"/><rect x="28" y="200" width="484" height="4" fill="#ce2145"/><text x="52" y="243" font-size="22" letter-spacing="1">ILLUSTRATION X</text><text x="52" y="297" font-size="30" font-weight="700">60 received / 6 qualified</text><text x="52" y="334" font-size="23" fill="#c4c7cd">Qualification rate: 10%</text><path d="M52 358H488" stroke="#4a535f"/><text x="52" y="399" font-size="23" fill="#c4c7cd">Cost per received enquiry</text><text x="52" y="444" font-size="34" font-weight="700">AUD 20</text><text x="52" y="491" font-size="23" fill="#c4c7cd">Cost per qualified enquiry</text><text x="52" y="537" font-size="34" font-weight="700">AUD 200</text><rect x="28" y="600" width="484" height="370" fill="#1b2129"/><rect x="28" y="600" width="484" height="4" fill="#ce2145"/><text x="52" y="643" font-size="22" letter-spacing="1">ILLUSTRATION Y</text><text x="52" y="697" font-size="30" font-weight="700">20 received / 8 qualified</text><text x="52" y="734" font-size="23" fill="#c4c7cd">Qualification rate: 40%</text><path d="M52 758H488" stroke="#4a535f"/><text x="52" y="799" font-size="23" fill="#c4c7cd">Cost per received enquiry</text><text x="52" y="844" font-size="34" font-weight="700">AUD 60</text><text x="52" y="891" font-size="23" fill="#c4c7cd">Cost per qualified enquiry</text><text x="52" y="937" font-size="34" font-weight="700">AUD 150</text><text x="28" y="1025" font-size="23" fill="#c4c7cd">Same criteria. All assessed.</text><text x="28" y="1062" font-size="23" fill="#c4c7cd">No pending cases.</text><text x="28" y="1110" font-size="23" font-weight="700">The business result is still open.</text><text x="28" y="1155" font-size="22" fill="#c4c7cd">Not an A/B test or profit figure.</text><text x="28" y="1192" font-size="22" fill="#c4c7cd">Does not establish cause.</text></g></svg>