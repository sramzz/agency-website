<svg xmlns="http://www.w3.org/2000/svg" width="540" height="910" viewBox="0 0 540 910" role="img" aria-labelledby="title desc"><title id="title">Three separate checks for a website enquiry</title><desc id="desc">A recorded interaction does not establish receipt. A received request does not establish follow-up. Inspect each stage separately.</desc><rect width="540" height="910" fill="#f7f6f2"/><g font-family="Arial, sans-serif" fill="#12161c"><text x="30" y="46" font-size="27" font-weight="700">One event is only part of the story.</text><g transform="translate(25 80)"><rect width="490" height="230" rx="6" fill="#ffffff" stroke="#c8cdd0"/><rect width="5" height="230" fill="#b51c38"/><text x="22" y="38" fill="#b51c38" font-size="18" font-weight="700">01 / CHECK SEPARATELY</text><text x="22" y="79" font-size="29" font-weight="700">Interaction recorded</text><text x="22" y="119" font-size="25" fill="#404c58">Analytics shows an event.</text><text x="22" y="202" font-size="22" fill="#53606c">Check: what triggered it?</text></g><g transform="translate(25 330)"><rect width="490" height="230" rx="6" fill="#ffffff" stroke="#c8cdd0"/><rect width="5" height="230" fill="#b51c38"/><text x="22" y="38" fill="#b51c38" font-size="18" font-weight="700">02 / CHECK SEPARATELY</text><text x="22" y="79" font-size="29" font-weight="700">Enquiry received</text><text x="22" y="119" font-size="25" fill="#404c58">Your team can retrieve</text><text x="22" y="147" font-size="25" fill="#404c58">the actual request.</text><text x="22" y="202" font-size="22" fill="#53606c">Check: storage and delivery.</text></g><g transform="translate(25 580)"><rect width="490" height="230" rx="6" fill="#ffffff" stroke="#c8cdd0"/><rect width="5" height="230" fill="#b51c38"/><text x="22" y="38" fill="#b51c38" font-size="18" font-weight="700">03 / CHECK SEPARATELY</text><text x="22" y="79" font-size="29" font-weight="700">Follow-up assigned</text><text x="22" y="119" font-size="25" fill="#404c58">Someone owns the request</text><text x="22" y="147" font-size="25" fill="#404c58">and its next step.</text><text x="22" y="202" font-size="22" fill="#53606c">Check: responsibility and status.</text></g><text x="30" y="861" font-size="22" font-weight="700">A recorded interaction ≠ a received enquiry.</text><text x="30" y="891" font-size="22" fill="#53606c">A received enquiry still needs a next step.</text></g></svg>