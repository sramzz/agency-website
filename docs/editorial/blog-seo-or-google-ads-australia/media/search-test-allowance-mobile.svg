<svg xmlns="http://www.w3.org/2000/svg" width="540" height="1645" viewBox="0 0 540 1645" role="img" aria-labelledby="title desc"><title id="title">A test allowance is more than media spend</title><desc id="desc">Hypothetical planning exercise, AUD excluding GST. Total included allowance 2,400 equals 800 included setup, management, page and measurement work plus 1,600 media. If spent at the assumed average CPC of 8, media gives 200 arithmetic clicks, not people, enquiries or a prediction of customers. Independently assumed first-time customers, one first job each: 2, 4 or 6. At 500 contribution per first job after stated variable delivery costs and before marketing and other excluded costs, balances after the included allowance are minus 1,400, minus 400 or plus 600. Five first jobs cover only the included marketing cost if assumptions stay unchanged. This is not a quote, forecast, observed campaign, net profit, cash flow or causal ROI.</desc><rect width="100%" height="100%" fill="#101318"/><g font-family="Arial,sans-serif"><text x="28" y="40" font-size="16" fill="#c0c6cf" font-weight="400">HYPOTHETICAL · AUD EXCLUDING GST</text><text x="28" y="94" font-size="34" fill="#fafaf7" font-weight="700">A test allowance is</text><text x="28" y="138" font-size="34" fill="#fafaf7" font-weight="700">more than media spend</text><text x="28" y="195" font-size="28" fill="#fafaf7" font-weight="700">2,400 total included allowance</text><rect x="28" y="222" width="161" height="24" fill="#9098a3"/><rect x="189" y="222" width="323" height="24" fill="#d52547"/><text x="28" y="287" font-size="25" fill="#fafaf7" font-weight="700">800 included work + 1,600 media</text><text x="28" y="331" font-size="23" fill="#e5e7eb" font-weight="400">Work: setup, management, page</text><text x="28" y="366" font-size="23" fill="#e5e7eb" font-weight="400">and measurement.</text><rect x="28" y="404" width="484" height="227" fill="#1b2027" stroke="#59616d"/><text x="50" y="449" font-size="26" fill="#fafaf7" font-weight="700">1,600 media ÷ 8 assumed CPC</text><text x="50" y="495" font-size="28" fill="#fafaf7" font-weight="700">= 200 arithmetic clicks</text><text x="50" y="541" font-size="23" fill="#e5e7eb" font-weight="400">Only if spent at that average.</text><text x="50" y="580" font-size="23" fill="#e5e7eb" font-weight="400">Clicks do not predict customers.</text><text x="28" y="690" font-size="29" fill="#fafaf7" font-weight="700">Separate customer assumptions</text><text x="28" y="732" font-size="23" fill="#e5e7eb" font-weight="400">First-time customers, one job each.</text><text x="28" y="769" font-size="23" fill="#e5e7eb" font-weight="400">These are not forecasts.</text><rect x="28" y="805" width="484" height="96" fill="#1b2027" stroke="#59616d"/><text x="50" y="843" font-size="26" fill="#fafaf7" font-weight="700">2 first jobs</text><text x="50" y="881" font-size="26" fill="#fafaf7" font-weight="700">−AUD 1,400 balance</text><rect x="28" y="921" width="484" height="96" fill="#1b2027" stroke="#59616d"/><text x="50" y="959" font-size="26" fill="#fafaf7" font-weight="700">4 first jobs</text><text x="50" y="997" font-size="26" fill="#fafaf7" font-weight="700">−AUD 400 balance</text><rect x="28" y="1037" width="484" height="96" fill="#1b2027" stroke="#59616d"/><text x="50" y="1075" font-size="26" fill="#fafaf7" font-weight="700">6 first jobs</text><text x="50" y="1113" font-size="26" fill="#fafaf7" font-weight="700">+AUD 600 balance</text><text x="28" y="1195" font-size="23" fill="#e5e7eb" font-weight="400">Balance = jobs × 500 contribution</text><text x="28" y="1232" font-size="23" fill="#e5e7eb" font-weight="400">− 2,400 included allowance.</text><text x="28" y="1282" font-size="23" fill="#e5e7eb" font-weight="400">Contribution follows stated variable</text><text x="28" y="1319" font-size="23" fill="#e5e7eb" font-weight="400">delivery costs, before marketing</text><text x="28" y="1356" font-size="23" fill="#e5e7eb" font-weight="400">and other excluded costs.</text><text x="28" y="1413" font-size="28" fill="#fafaf7" font-weight="700">5 first jobs cover only the</text><text x="28" y="1452" font-size="28" fill="#fafaf7" font-weight="700">included marketing cost.</text><text x="28" y="1505" font-size="23" fill="#c0c6cf" font-weight="400">Assumptions must stay unchanged.</text><text x="28" y="1543" font-size="23" fill="#c0c6cf" font-weight="400">Not net profit, cash flow or causal ROI.</text><text x="28" y="1595" font-size="22" fill="#c0c6cf" font-weight="400">No campaign or result represented.</text></g></svg>