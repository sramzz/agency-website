<svg xmlns="http://www.w3.org/2000/svg" width="540" height="1600" viewBox="0 0 540 1600" role="img" aria-labelledby="title desc"><title id="title">One person, two projects</title><desc id="desc">Fictional Perth landscaping example. One confirmed contact C01 has two opportunities: I01 and I02 relate to O01, project A. Quote Q01-v1 is superseded by Q01-v2, accepted under the business process, with O01 won and accepted job J01. I03 relates to O02, project B, awaiting assessment. I04 stays in an owned intake queue, unassociated pending verification. Four labelled enquiry interactions, one contact, two opportunities, two versions of one quote, one accepted job and one first-time customer; one unresolved intake item. Not a count of every communication or a conversion rate. Acceptance does not prove delivery, recognised revenue or payment.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#aeb3bc"/></marker></defs><rect width="100%" height="100%" fill="#101318"/><g font-family="Arial,sans-serif"><text x="28" y="40" font-size="17" fill="#c3c7ce" font-weight="400">FICTIONAL PERTH EXAMPLE</text><text x="28" y="87" font-size="34" fill="#f7f6f2" font-weight="700">One person,</text><text x="28" y="128" font-size="34" fill="#f7f6f2" font-weight="700">two projects.</text><text x="28" y="168" font-size="22" fill="#c3c7ce" font-weight="400">Keep each piece of work distinct.</text><rect x="44" y="205" width="468" height="100" fill="#1a1e24" stroke="#4b5159"/><text x="68" y="246" font-size="21" fill="#f7f6f2" font-weight="700">C01 · ONE CONFIRMED CONTACT</text><text x="68" y="281" font-size="21" fill="#e9e9e6" font-weight="400">The same person in both projects</text><path d="M44 255H20V875H43" fill="none" stroke="#aeb3bc" stroke-width="2" marker-end="url(#arrow)"/><path d="M20 376H43" stroke="#aeb3bc" stroke-width="2" marker-end="url(#arrow)"/><rect x="44" y="343" width="468" height="420" fill="#1a1e24" stroke="#4b5159"/><text x="68" y="387" font-size="29" fill="#f7f6f2" font-weight="700">O01 · PROJECT A</text><text x="68" y="434" font-size="24" fill="#e9e9e6" font-weight="400">I01: first enquiry</text><text x="68" y="475" font-size="24" fill="#e9e9e6" font-weight="400">I02: verified follow-up call</text><text x="68" y="528" font-size="24" fill="#c3c7ce" font-weight="400">Q01-v1: superseded</text><text x="68" y="569" font-size="24" fill="#e9e9e6" font-weight="400">Q01-v2: current and accepted</text><text x="68" y="622" font-size="24" fill="#f7f6f2" font-weight="700">O01 won → accepted job J01</text><text x="68" y="678" font-size="23" fill="#e9e9e6" font-weight="400">One first-time customer,</text><text x="68" y="718" font-size="23" fill="#e9e9e6" font-weight="400">under this example’s definition.</text><rect x="44" y="803" width="468" height="230" fill="#1a1e24" stroke="#4b5159"/><text x="68" y="846" font-size="29" fill="#f7f6f2" font-weight="700">O02 · PROJECT B</text><text x="68" y="891" font-size="24" fill="#e9e9e6" font-weight="400">I03: a separate request</text><text x="68" y="932" font-size="24" fill="#e9e9e6" font-weight="400">Assessment pending</text><text x="68" y="977" font-size="23" fill="#e9e9e6" font-weight="400">Still C01. Not a new customer.</text><rect x="28" y="1080" width="484" height="185" fill="#1a1e24" stroke="#d52649"/><text x="52" y="1121" font-size="25" fill="#f7f6f2" font-weight="700">I04 · UNRESOLVED INTAKE</text><text x="52" y="1163" font-size="23" fill="#e9e9e6" font-weight="400">Shared inbox. Identity uncertain.</text><text x="52" y="1203" font-size="23" fill="#e9e9e6" font-weight="400">Keep an owner. Verify before</text><text x="52" y="1239" font-size="23" fill="#e9e9e6" font-weight="400">linking or merging.</text><text x="28" y="1310" font-size="23" fill="#e9e9e6" font-weight="400">4 labelled enquiry interactions</text><text x="28" y="1350" font-size="23" fill="#e9e9e6" font-weight="400">1 contact · 2 opportunities</text><text x="28" y="1390" font-size="23" fill="#e9e9e6" font-weight="400">2 versions of 1 quote · 1 accepted job</text><text x="28" y="1430" font-size="23" fill="#e9e9e6" font-weight="400">1 first-time customer · 1 unresolved</text><text x="28" y="1471" font-size="21" fill="#c3c7ce" font-weight="400">Not every message or a conversion rate.</text><text x="28" y="1524" font-size="22" fill="#c3c7ce" font-weight="400">Acceptance does not prove delivery,</text><text x="28" y="1561" font-size="22" fill="#c3c7ce" font-weight="400">recognised revenue or payment.</text></g></svg>