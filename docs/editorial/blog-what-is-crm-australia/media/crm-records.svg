<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1080" viewBox="0 0 1000 1080" role="img" aria-labelledby="title desc"><title id="title">One person, two projects</title><desc id="desc">Fictional Perth landscaping example. One confirmed contact C01 has two opportunities: I01 and I02 relate to O01, project A. Quote Q01-v1 is superseded by Q01-v2, accepted under the business process, with O01 won and accepted job J01. I03 relates to O02, project B, awaiting assessment. I04 stays in an owned intake queue, unassociated pending verification. Four labelled enquiry interactions, one contact, two opportunities, two versions of one quote, one accepted job and one first-time customer; one unresolved intake item. Not a count of every communication or a conversion rate. Acceptance does not prove delivery, recognised revenue or payment.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#aeb3bc"/></marker></defs><rect width="100%" height="100%" fill="#101318"/><g font-family="Arial,sans-serif"><text x="40" y="42" font-size="16" fill="#c3c7ce" font-weight="400">FICTIONAL PERTH EXAMPLE</text><text x="40" y="91" font-size="38" fill="#f7f6f2" font-weight="700">One person, two projects</text><text x="40" y="127" font-size="23" fill="#c3c7ce" font-weight="400">A new conversation is not always a new opportunity.</text><rect x="300" y="164" width="400" height="96" fill="#1a1e24" stroke="#4b5159"/><text x="324" y="202" font-size="22" fill="#f7f6f2" font-weight="700">C01 · ONE CONFIRMED CONTACT</text><text x="324" y="235" font-size="21" fill="#e9e9e6" font-weight="400">The same person, separate projects</text><path d="M500 260V284H266V312M500 284H734V312" fill="none" stroke="#aeb3bc" stroke-width="2" marker-end="url(#arrow)"/><path d="M266 284V312" stroke="#aeb3bc" stroke-width="2" marker-end="url(#arrow)"/><rect x="40" y="314" width="450" height="350" fill="#1a1e24" stroke="#4b5159"/><text x="64" y="354" font-size="27" fill="#f7f6f2" font-weight="700">O01 · PROJECT A</text><text x="64" y="394" font-size="23" fill="#e9e9e6" font-weight="400">I01: first enquiry</text><text x="64" y="432" font-size="23" fill="#e9e9e6" font-weight="400">I02: verified follow-up call</text><text x="64" y="480" font-size="23" fill="#c3c7ce" font-weight="400">Q01-v1: superseded</text><text x="64" y="518" font-size="23" fill="#e9e9e6" font-weight="400">Q01-v2: current and accepted</text><text x="64" y="566" font-size="23" fill="#f7f6f2" font-weight="700">O01 won → accepted job J01</text><text x="64" y="609" font-size="21" fill="#e9e9e6" font-weight="400">One first-time customer,</text><text x="64" y="640" font-size="21" fill="#e9e9e6" font-weight="400">under this example’s definition.</text><rect x="510" y="314" width="450" height="235" fill="#1a1e24" stroke="#4b5159"/><text x="534" y="354" font-size="27" fill="#f7f6f2" font-weight="700">O02 · PROJECT B</text><text x="534" y="394" font-size="23" fill="#e9e9e6" font-weight="400">I03: a separate request</text><text x="534" y="432" font-size="23" fill="#e9e9e6" font-weight="400">Assessment pending</text><text x="534" y="478" font-size="23" fill="#f7f6f2" font-weight="700">Still contact C01.</text><text x="534" y="515" font-size="22" fill="#e9e9e6" font-weight="400">Not another new customer.</text><rect x="40" y="712" width="920" height="140" fill="#1a1e24" stroke="#d52649"/><text x="64" y="752" font-size="25" fill="#f7f6f2" font-weight="700">I04 · UNRESOLVED INTAKE</text><text x="64" y="791" font-size="23" fill="#e9e9e6" font-weight="400">Shared inbox. Person and project uncertain.</text><text x="64" y="827" font-size="23" fill="#e9e9e6" font-weight="400">Keep an owner. Verify before linking or merging.</text><text x="40" y="902" font-size="22" fill="#e9e9e6" font-weight="400">4 labelled enquiry interactions · 1 confirmed contact · 2 opportunities</text><text x="40" y="940" font-size="22" fill="#e9e9e6" font-weight="400">2 versions of 1 quote · 1 accepted job · 1 first-time customer</text><text x="40" y="978" font-size="21" fill="#c3c7ce" font-weight="400">1 unresolved intake item · not every communication or a conversion rate</text><text x="40" y="1037" font-size="21" fill="#c3c7ce" font-weight="400">Acceptance does not prove delivery, recognised revenue or payment.</text></g></svg>