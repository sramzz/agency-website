<svg xmlns="http://www.w3.org/2000/svg" width="540" height="1460" viewBox="0 0 540 1460" role="img" aria-labelledby="title desc"><title id="title">Three different publication checks</title><desc id="desc">Editorial questions, not a legal certificate or permission. Genuine experience: retain the source, relevant service and original meaning. Basis and scope of use: check rights, authority, attribution, channels, media, privacy and applicable platform conditions. Claims and context: check evidence, qualifiers, selection and the overall impression on the finished page. A recorded approval does not establish every advertising claim. Decisions can include final checks, revising, seeking evidence, clarifying rights or not publishing. These questions do not grant rights or certify compliance. No real customer material or outcome is represented.</desc><rect width="100%" height="100%" fill="#101318"/><g font-family="Arial,sans-serif"><text x="28" y="40" font-size="17" fill="#c0c6cf" font-weight="400">EDITORIAL QUESTIONS</text><text x="28" y="88" font-size="35" fill="#fafaf7" font-weight="700">Three different</text><text x="28" y="133" font-size="35" fill="#fafaf7" font-weight="700">publication checks</text><rect x="28" y="176" width="484" height="270" fill="#1b2027" stroke="#59616d"/><text x="52" y="214" font-size="20" fill="#f24563" font-weight="700">01</text><text x="52" y="257" font-size="28" fill="#fafaf7" font-weight="700">Genuine experience</text><text x="52" y="301" font-size="23" fill="#e5e7eb" font-weight="400">Keep the source, relevant service</text><text x="52" y="336" font-size="23" fill="#e5e7eb" font-weight="400">and original wording.</text><text x="52" y="371" font-size="23" fill="#e5e7eb" font-weight="400">Does the excerpt preserve</text><text x="52" y="406" font-size="23" fill="#e5e7eb" font-weight="400">what the person meant?</text><rect x="28" y="468" width="484" height="270" fill="#1b2027" stroke="#59616d"/><text x="52" y="506" font-size="20" fill="#f24563" font-weight="700">02</text><text x="52" y="549" font-size="28" fill="#fafaf7" font-weight="700">Basis and scope of use</text><text x="52" y="593" font-size="23" fill="#e5e7eb" font-weight="400">Check rights, authority, attribution</text><text x="52" y="628" font-size="23" fill="#e5e7eb" font-weight="400">and intended channels.</text><text x="52" y="663" font-size="23" fill="#e5e7eb" font-weight="400">Consider media, privacy and</text><text x="52" y="698" font-size="23" fill="#e5e7eb" font-weight="400">applicable platform conditions.</text><rect x="28" y="760" width="484" height="270" fill="#1b2027" stroke="#59616d"/><text x="52" y="798" font-size="20" fill="#f24563" font-weight="700">03</text><text x="52" y="841" font-size="28" fill="#fafaf7" font-weight="700">Claims and context</text><text x="52" y="885" font-size="23" fill="#e5e7eb" font-weight="400">Check evidence, qualifiers</text><text x="52" y="920" font-size="23" fill="#e5e7eb" font-weight="400">and the selection shown.</text><text x="52" y="955" font-size="23" fill="#e5e7eb" font-weight="400">Read the quote with its heading</text><text x="52" y="990" font-size="23" fill="#e5e7eb" font-weight="400">and surrounding message.</text><text x="28" y="1097" font-size="29" fill="#fafaf7" font-weight="700">Then record a decision</text><text x="28" y="1141" font-size="23" fill="#e5e7eb" font-weight="400">Final checks, revise, seek evidence,</text><text x="28" y="1178" font-size="23" fill="#e5e7eb" font-weight="400">clarify rights or do not publish.</text><text x="28" y="1238" font-size="23" fill="#e5e7eb" font-weight="400">Check the finished page, including</text><text x="28" y="1275" font-size="23" fill="#e5e7eb" font-weight="400">qualifiers and disclosures.</text><text x="28" y="1334" font-size="23" fill="#c0c6cf" font-weight="400">These questions do not grant rights</text><text x="28" y="1371" font-size="23" fill="#c0c6cf" font-weight="400">or certify compliance.</text><text x="28" y="1422" font-size="21" fill="#c0c6cf" font-weight="400">No real customer material represented.</text></g></svg>