<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1070" viewBox="0 0 1000 1070" role="img" aria-labelledby="title desc"><title id="title">The website changed. The answer did not.</title><desc id="desc">Fictional Saturday-visit example, not a chatbot test. K2-v2 is the current approved guide: standard visits are on weekdays and Saturday visits require separate confirmation. The website reflects K2-v2, but the superseded K1-v1 PDF remains eligible for search. The chatbot retrieves K1-v1 and says Saturday visits are included. Check source eligibility and selection, then verify that K2-v2 is accessible, retrieved with its conditions intact and correctly reflected in the response. The expected answer does not invent a Saturday price, available slot or booking. No repair or test result is represented.</desc><rect width="100%" height="100%" fill="#101318"/><g font-family="Arial,sans-serif"><text x="40" y="42" font-size="16" fill="#c0c6cf" font-weight="400">FICTIONAL SATURDAY-VISIT EXAMPLE · NOT A TEST RESULT</text><text x="40" y="98" font-size="38" fill="#fafaf7" font-weight="700">The website changed.</text><text x="40" y="148" font-size="38" fill="#fafaf7" font-weight="700">The answer did not.</text><rect x="40" y="190" width="920" height="191" fill="#1b2027" stroke="#59616d"/><text x="64" y="231" font-size="19" fill="#c0c6cf" font-weight="700">CURRENT APPROVED RULE · K2-v2</text><text x="64" y="278" font-size="29" fill="#fafaf7" font-weight="700">Standard visits are on weekdays.</text><text x="64" y="322" font-size="26" fill="#e5e7eb" font-weight="400">Saturday visits require separate confirmation.</text><text x="64" y="358" font-size="23" fill="#e5e7eb" font-weight="400">The website already reflects this rule.</text><text x="40" y="433" font-size="30" fill="#fafaf7" font-weight="700">What the chatbot actually used</text><rect x="40" y="467" width="270" height="165" fill="#1b2027" stroke="#59616d"/><text x="58" y="501" font-size="17" fill="#f0526c" font-weight="700">01</text><text x="58" y="543" font-size="24" fill="#fafaf7" font-weight="700">Old PDF · K1-v1</text><text x="58" y="579" font-size="23" fill="#e5e7eb" font-weight="400">Still eligible</text><text x="58" y="611" font-size="23" fill="#e5e7eb" font-weight="400">for search</text><rect x="365" y="467" width="270" height="165" fill="#1b2027" stroke="#59616d"/><text x="383" y="501" font-size="17" fill="#f0526c" font-weight="700">02</text><text x="383" y="543" font-size="24" fill="#fafaf7" font-weight="700">Retrieved evidence</text><text x="383" y="579" font-size="23" fill="#e5e7eb" font-weight="400">K1-v1 supplied</text><text x="383" y="611" font-size="23" fill="#e5e7eb" font-weight="400">to the model</text><rect x="690" y="467" width="270" height="165" fill="#1b2027" stroke="#59616d"/><text x="708" y="501" font-size="17" fill="#f0526c" font-weight="700">03</text><text x="708" y="543" font-size="24" fill="#fafaf7" font-weight="700">Wrong reply</text><text x="708" y="579" font-size="23" fill="#e5e7eb" font-weight="400">Saturday visits</text><text x="708" y="611" font-size="23" fill="#e5e7eb" font-weight="400">are included</text><path d="M318 550h36m-10-9 10 9-10 9M643 550h36m-10-9 10 9-10 9" fill="none" stroke="#c0c6cf" stroke-width="2"/><rect x="40" y="681" width="920" height="169" fill="#1b2027" stroke="#bd2444"/><text x="64" y="722" font-size="18" fill="#f0526c" font-weight="700">EXPECTED RESPONSE · NOT AN OBSERVED REPAIR</text><text x="64" y="769" font-size="29" fill="#fafaf7" font-weight="700">Standard visits are on weekdays.</text><text x="64" y="811" font-size="27" fill="#e5e7eb" font-weight="400">Saturday visits need separate confirmation.</text><text x="40" y="902" font-size="27" fill="#fafaf7" font-weight="700">Check why K1-v1 was eligible and selected.</text><text x="40" y="945" font-size="24" fill="#e5e7eb" font-weight="400">Then verify that K2-v2 is found with its conditions intact</text><text x="40" y="984" font-size="24" fill="#e5e7eb" font-weight="400">and that the final reply preserves them.</text><text x="40" y="1033" font-size="22" fill="#c0c6cf" font-weight="400">No invented Saturday price, available slot or confirmed booking.</text></g></svg>