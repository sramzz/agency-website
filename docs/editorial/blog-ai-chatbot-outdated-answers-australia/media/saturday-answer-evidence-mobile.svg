<svg xmlns="http://www.w3.org/2000/svg" width="540" height="1545" viewBox="0 0 540 1545" role="img" aria-labelledby="title desc"><title id="title">The website changed. The answer did not.</title><desc id="desc">Fictional Saturday-visit example, not a chatbot test. K2-v2 is the current approved guide: standard visits are on weekdays and Saturday visits require separate confirmation. The website reflects K2-v2, but the superseded K1-v1 PDF remains eligible for search. The chatbot retrieves K1-v1 and says Saturday visits are included. Check source eligibility and selection, then verify that K2-v2 is accessible, retrieved with its conditions intact and correctly reflected in the response. The expected answer does not invent a Saturday price, available slot or booking. No repair or test result is represented.</desc><rect width="100%" height="100%" fill="#101318"/><g font-family="Arial,sans-serif"><text x="28" y="38" font-size="15" fill="#c0c6cf" font-weight="400">FICTIONAL EXAMPLE · NOT A TEST RESULT</text><text x="28" y="93" font-size="34" fill="#fafaf7" font-weight="700">The website changed.</text><text x="28" y="138" font-size="34" fill="#fafaf7" font-weight="700">The answer did not.</text><rect x="28" y="180" width="484" height="220" fill="#1b2027" stroke="#59616d"/><text x="48" y="219" font-size="19" fill="#c0c6cf" font-weight="700">APPROVED RULE · K2-v2</text><text x="48" y="264" font-size="25" fill="#fafaf7" font-weight="700">Standard visits are on weekdays.</text><text x="48" y="305" font-size="25" fill="#e5e7eb" font-weight="400">Saturday visits require</text><text x="48" y="341" font-size="25" fill="#e5e7eb" font-weight="400">separate confirmation.</text><text x="48" y="379" font-size="22" fill="#e5e7eb" font-weight="400">The website reflects this rule.</text><text x="28" y="452" font-size="29" fill="#fafaf7" font-weight="700">What the chatbot used</text><rect x="28" y="486" width="484" height="145" fill="#1b2027" stroke="#59616d"/><text x="48" y="523" font-size="20" fill="#fafaf7" font-weight="700">01 · OLD PDF · K1-v1</text><text x="48" y="566" font-size="24" fill="#e5e7eb" font-weight="400">Still eligible for search.</text><text x="48" y="603" font-size="23" fill="#e5e7eb" font-weight="400">Superseded rule includes Saturdays.</text><rect x="28" y="658" width="484" height="145" fill="#1b2027" stroke="#59616d"/><text x="48" y="695" font-size="20" fill="#fafaf7" font-weight="700">02 · RETRIEVED EVIDENCE</text><text x="48" y="738" font-size="24" fill="#e5e7eb" font-weight="400">K1-v1 is supplied to the model.</text><text x="48" y="775" font-size="23" fill="#e5e7eb" font-weight="400">The approved rule was not used.</text><rect x="28" y="830" width="484" height="145" fill="#1b2027" stroke="#59616d"/><text x="48" y="867" font-size="20" fill="#fafaf7" font-weight="700">03 · WRONG REPLY</text><text x="48" y="910" font-size="24" fill="#e5e7eb" font-weight="400">Saturday visits are included.</text><text x="48" y="947" font-size="23" fill="#e5e7eb" font-weight="400">This repeats the old inclusion.</text><path d="M270 635v18m-8-8 8 8 8-8M270 807v18m-8-8 8 8 8-8" fill="none" stroke="#c0c6cf" stroke-width="2"/><rect x="28" y="1015" width="484" height="204" fill="#1b2027" stroke="#bd2444"/><text x="48" y="1053" font-size="20" fill="#f0526c" font-weight="700">EXPECTED RESPONSE</text><text x="48" y="1097" font-size="25" fill="#fafaf7" font-weight="700">Standard visits are on weekdays.</text><text x="48" y="1140" font-size="25" fill="#e5e7eb" font-weight="400">Saturday visits need</text><text x="48" y="1178" font-size="25" fill="#e5e7eb" font-weight="400">separate confirmation.</text><text x="28" y="1272" font-size="27" fill="#fafaf7" font-weight="700">Check eligibility and selection.</text><text x="28" y="1318" font-size="24" fill="#e5e7eb" font-weight="400">Then check that K2-v2 is found</text><text x="28" y="1355" font-size="24" fill="#e5e7eb" font-weight="400">and the reply keeps its conditions.</text><text x="28" y="1410" font-size="23" fill="#c0c6cf" font-weight="400">No price, slot or booking invented.</text><text x="28" y="1465" font-size="23" fill="#c0c6cf" font-weight="400">No repair has been observed here.</text><text x="28" y="1508" font-size="22" fill="#c0c6cf" font-weight="400">Investigate other cases separately.</text></g></svg>