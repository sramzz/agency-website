<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1030" viewBox="0 0 1000 1030" role="img" aria-labelledby="title desc"><title id="title">Content and URL: two separate decisions</title><desc id="desc">Five fictional teaching cases, not a real audit or executed changes. A: keep an accurate distinct guide at its existing address. B: update changed quote-submission instructions at the same address and test the route. C: combine guides confirmed to answer the same task, preserving useful details; verify a genuine replacement before permanently redirecting retired addresses with 301 or 308. D: remove an expired offer with no continuing purpose or equivalent replacement, using an appropriate 404 or 410 and updating controlled links. E: investigate missing evidence; retain pending investigation, with no removal approved. A 410 is not a redirect. Proposed decisions are different from observed technical or business results.</desc><rect width="100%" height="100%" fill="#101318"/><g font-family="Arial,sans-serif"><text x="40" y="43" font-size="16" fill="#c0c6cf" font-weight="400">FIVE FICTIONAL CASES · PLANNING AID</text><text x="40" y="93" font-size="35" fill="#fafaf7" font-weight="700">Content and URL: two separate decisions</text><text x="40" y="136" font-size="23" fill="#c0c6cf" font-weight="400">Start with the reader’s need and the evidence available.</text><text x="96" y="179" font-size="17" fill="#c0c6cf" font-weight="400">CONTENT DECISION</text><text x="490" y="179" font-size="17" fill="#c0c6cf" font-weight="400">URL TREATMENT</text><rect x="40" y="200" width="920" height="108" fill="#1b2027" stroke="#4b535f"/><text x="59" y="243" font-size="27" fill="#f24563" font-weight="700">A</text><text x="96" y="243" font-size="27" fill="#fafaf7" font-weight="700">Keep</text><text x="96" y="282" font-size="21" fill="#e5e7eb" font-weight="400">Accurate and distinct</text><text x="490" y="243" font-size="23" fill="#e5e7eb" font-weight="400">Keep the existing address.</text><rect x="40" y="325" width="920" height="108" fill="#1b2027" stroke="#4b535f"/><text x="59" y="368" font-size="27" fill="#f24563" font-weight="700">B</text><text x="96" y="368" font-size="27" fill="#fafaf7" font-weight="700">Update</text><text x="96" y="407" font-size="21" fill="#e5e7eb" font-weight="400">Submission steps changed</text><text x="490" y="368" font-size="23" fill="#e5e7eb" font-weight="400">Keep the address; test the new route.</text><rect x="40" y="450" width="920" height="133" fill="#1b2027" stroke="#4b535f"/><text x="59" y="493" font-size="27" fill="#f24563" font-weight="700">C</text><text x="96" y="493" font-size="27" fill="#fafaf7" font-weight="700">Combine</text><text x="96" y="532" font-size="21" fill="#e5e7eb" font-weight="400">Same task; useful details in both</text><text x="490" y="493" font-size="23" fill="#e5e7eb" font-weight="400">Verify a genuine replacement first.</text><text x="490" y="532" font-size="23" fill="#e5e7eb" font-weight="400">Then 301 / 308 for retired addresses.</text><rect x="40" y="600" width="920" height="128" fill="#1b2027" stroke="#4b535f"/><text x="59" y="643" font-size="27" fill="#f24563" font-weight="700">D</text><text x="96" y="643" font-size="27" fill="#fafaf7" font-weight="700">Remove</text><text x="96" y="682" font-size="21" fill="#e5e7eb" font-weight="400">No continuing useful purpose</text><text x="490" y="643" font-size="23" fill="#e5e7eb" font-weight="400">404 / 410 when no relevant</text><text x="490" y="682" font-size="23" fill="#e5e7eb" font-weight="400">replacement exists.</text><rect x="40" y="745" width="920" height="128" fill="#1b2027" stroke="#4b535f"/><text x="59" y="788" font-size="27" fill="#f24563" font-weight="700">E</text><text x="96" y="788" font-size="27" fill="#fafaf7" font-weight="700">Investigate first</text><text x="96" y="827" font-size="21" fill="#e5e7eb" font-weight="400">Evidence incomplete</text><text x="490" y="788" font-size="23" fill="#e5e7eb" font-weight="400">Retain pending investigation.</text><text x="490" y="827" font-size="23" fill="#e5e7eb" font-weight="400">No removal approved.</text><text x="40" y="923" font-size="23" fill="#e5e7eb" font-weight="400">Verify the page, response, links and affected references.</text><text x="40" y="966" font-size="22" fill="#c0c6cf" font-weight="400">A 410 is not a redirect. These are proposals, not observed results.</text><text x="40" y="1003" font-size="21" fill="#c0c6cf" font-weight="400">No real page was changed in these examples.</text></g></svg>