<svg xmlns="http://www.w3.org/2000/svg" width="540" height="1800" viewBox="0 0 540 1800" role="img" aria-labelledby="title desc"><title id="title">Content and URL: two separate decisions</title><desc id="desc">Five fictional teaching cases, not a real audit or executed changes. A: keep an accurate distinct guide at its existing address. B: update changed quote-submission instructions at the same address and test the route. C: combine guides confirmed to answer the same task, preserving useful details; verify a genuine replacement before permanently redirecting retired addresses with 301 or 308. D: remove an expired offer with no continuing purpose or equivalent replacement, using an appropriate 404 or 410 and updating controlled links. E: investigate missing evidence; retain pending investigation, with no removal approved. A 410 is not a redirect. Proposed decisions are different from observed technical or business results.</desc><rect width="100%" height="100%" fill="#101318"/><g font-family="Arial,sans-serif"><text x="28" y="40" font-size="17" fill="#c0c6cf" font-weight="400">FICTIONAL CASES · PLANNING AID</text><text x="28" y="88" font-size="34" fill="#fafaf7" font-weight="700">Content and URL:</text><text x="28" y="131" font-size="34" fill="#fafaf7" font-weight="700">two separate decisions.</text><rect x="28" y="180" width="484" height="210" fill="#1b2027" stroke="#4b535f"/><text x="52" y="224" font-size="26" fill="#f24563" font-weight="700">A</text><text x="92" y="224" font-size="29" fill="#fafaf7" font-weight="700">Keep</text><text x="52" y="264" font-size="23" fill="#e5e7eb" font-weight="400">Accurate and distinct</text><path d="M52 285H488" stroke="#4b535f"/><text x="52" y="317" font-size="17" fill="#c0c6cf" font-weight="400">URL TREATMENT</text><text x="52" y="353" font-size="23" fill="#e5e7eb" font-weight="400">Keep the existing address.</text><rect x="28" y="410" width="484" height="245" fill="#1b2027" stroke="#4b535f"/><text x="52" y="454" font-size="26" fill="#f24563" font-weight="700">B</text><text x="92" y="454" font-size="29" fill="#fafaf7" font-weight="700">Update</text><text x="52" y="494" font-size="23" fill="#e5e7eb" font-weight="400">Submission steps changed</text><path d="M52 515H488" stroke="#4b535f"/><text x="52" y="547" font-size="17" fill="#c0c6cf" font-weight="400">URL TREATMENT</text><text x="52" y="583" font-size="23" fill="#e5e7eb" font-weight="400">Keep the address;</text><text x="52" y="617" font-size="23" fill="#e5e7eb" font-weight="400">test the new route.</text><rect x="28" y="675" width="484" height="295" fill="#1b2027" stroke="#4b535f"/><text x="52" y="719" font-size="26" fill="#f24563" font-weight="700">C</text><text x="92" y="719" font-size="29" fill="#fafaf7" font-weight="700">Combine</text><text x="52" y="759" font-size="23" fill="#e5e7eb" font-weight="400">Same task; useful details in both</text><path d="M52 780H488" stroke="#4b535f"/><text x="52" y="812" font-size="17" fill="#c0c6cf" font-weight="400">URL TREATMENT</text><text x="52" y="848" font-size="23" fill="#e5e7eb" font-weight="400">Verify a genuine replacement.</text><text x="52" y="882" font-size="23" fill="#e5e7eb" font-weight="400">Then 301 / 308 for retired</text><text x="52" y="916" font-size="23" fill="#e5e7eb" font-weight="400">addresses it replaces.</text><rect x="28" y="990" width="484" height="250" fill="#1b2027" stroke="#4b535f"/><text x="52" y="1034" font-size="26" fill="#f24563" font-weight="700">D</text><text x="92" y="1034" font-size="29" fill="#fafaf7" font-weight="700">Remove</text><text x="52" y="1074" font-size="23" fill="#e5e7eb" font-weight="400">No continuing useful purpose</text><path d="M52 1095H488" stroke="#4b535f"/><text x="52" y="1127" font-size="17" fill="#c0c6cf" font-weight="400">URL TREATMENT</text><text x="52" y="1163" font-size="23" fill="#e5e7eb" font-weight="400">404 / 410 when no relevant</text><text x="52" y="1197" font-size="23" fill="#e5e7eb" font-weight="400">replacement exists.</text><rect x="28" y="1260" width="484" height="240" fill="#1b2027" stroke="#4b535f"/><text x="52" y="1304" font-size="26" fill="#f24563" font-weight="700">E</text><text x="92" y="1304" font-size="29" fill="#fafaf7" font-weight="700">Investigate first</text><text x="52" y="1344" font-size="23" fill="#e5e7eb" font-weight="400">Evidence incomplete</text><path d="M52 1365H488" stroke="#4b535f"/><text x="52" y="1397" font-size="17" fill="#c0c6cf" font-weight="400">URL TREATMENT</text><text x="52" y="1433" font-size="23" fill="#e5e7eb" font-weight="400">Retain pending investigation.</text><text x="52" y="1467" font-size="23" fill="#e5e7eb" font-weight="400">No removal approved.</text><text x="28" y="1555" font-size="23" fill="#e5e7eb" font-weight="400">Verify the page, response, links</text><text x="28" y="1591" font-size="23" fill="#e5e7eb" font-weight="400">and affected references.</text><text x="28" y="1643" font-size="23" fill="#c0c6cf" font-weight="400">A 410 is not a redirect.</text><text x="28" y="1685" font-size="22" fill="#c0c6cf" font-weight="400">Proposals are not observed results.</text><text x="28" y="1729" font-size="22" fill="#c0c6cf" font-weight="400">No real page was changed</text><text x="28" y="1765" font-size="22" fill="#c0c6cf" font-weight="400">in these examples.</text></g></svg>