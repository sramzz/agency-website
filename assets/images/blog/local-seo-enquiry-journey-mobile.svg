<svg xmlns="http://www.w3.org/2000/svg" width="540" height="970" viewBox="0 0 540 970" role="img" aria-labelledby="title desc"><title id="title">A click is only the start</title><desc id="desc">An illustrative sequence: a phone-button click, a connected call, a suitable enquiry, then a booking or accepted quote. Each stage needs its own evidence.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10" fill="#ff304f"/></marker></defs><g font-family="Arial, sans-serif"><rect x="1" y="1" width="538" height="968" rx="12" fill="#0c1017" stroke="#343944"/><text x="28" y="43" font-size="12" fill="#ff304f" font-weight="700" letter-spacing="2">FOLLOW THE ENQUIRY</text><text x="28" y="89" font-size="31" fill="#f8fafc" font-weight="700" >A click is only the start</text><text x="28" y="124" font-size="17" fill="#aeb8c6" font-weight="400" >Check each step after a phone click.</text><rect x="28" y="156" width="484" height="154" rx="7" fill="#121823" stroke="#ff304f"/><text x="50" y="185" font-size="12" fill="#ff304f" font-weight="700" letter-spacing="1">01</text><text x="50" y="225" font-size="26" fill="#f8fafc" font-weight="700" >Phone button clicked</text><text x="50" y="261" font-size="18" fill="#aeb8c6" font-weight="400" >Recorded in Business Profile Performance.</text><path d="M 270 315 V 339" fill="none" stroke="#ff304f" stroke-width="2" marker-end="url(#arrow)"/><rect x="28" y="346" width="484" height="154" rx="7" fill="#121823" stroke="#343944"/><text x="50" y="375" font-size="12" fill="#ff304f" font-weight="700" letter-spacing="1">02</text><text x="50" y="415" font-size="26" fill="#f8fafc" font-weight="700" >Call connected</text><text x="50" y="451" font-size="18" fill="#aeb8c6" font-weight="400" >Check call records and whether</text><text x="50" y="474" font-size="18" fill="#aeb8c6" font-weight="400" >the team answered.</text><path d="M 270 505 V 529" fill="none" stroke="#ff304f" stroke-width="2" marker-end="url(#arrow)"/><rect x="28" y="536" width="484" height="154" rx="7" fill="#121823" stroke="#343944"/><text x="50" y="565" font-size="12" fill="#ff304f" font-weight="700" letter-spacing="1">03</text><text x="50" y="605" font-size="26" fill="#f8fafc" font-weight="700" >Suitable enquiry</text><text x="50" y="641" font-size="18" fill="#aeb8c6" font-weight="400" >Confirm service, area and availability.</text><path d="M 270 695 V 719" fill="none" stroke="#ff304f" stroke-width="2" marker-end="url(#arrow)"/><rect x="28" y="726" width="484" height="154" rx="7" fill="#121823" stroke="#343944"/><text x="50" y="755" font-size="12" fill="#ff304f" font-weight="700" letter-spacing="1">04</text><text x="50" y="795" font-size="26" fill="#f8fafc" font-weight="700" >Booking or accepted quote</text><text x="50" y="831" font-size="18" fill="#aeb8c6" font-weight="400" >Confirm in your business records.</text><text x="28" y="920" font-size="17" fill="#aeb8c6" font-weight="400" >Illustrative route. Each stage needs</text><text x="28" y="945" font-size="17" fill="#aeb8c6" font-weight="400" >evidence of its own.</text></g></svg>
