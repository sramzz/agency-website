<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="450" viewBox="0 0 1000 450" role="img" aria-labelledby="title desc">
<title id="title">Two searches, one possible route to an enquiry</title>
<desc id="desc">A hypothetical Melbourne office-cleaning customer uses Google search or asks an AI assistant. They may check a business's coverage, service scope and after-hours access, then request a quote. This is an example, not a guaranteed outcome.</desc>
<defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="m1 1 6 3-6 3" fill="none" stroke="#ff304f" stroke-width="1.3"/></marker></defs>
<rect width="1000" height="450" rx="16" fill="#0a0b10"/>
<g font-family="Inter, Arial, sans-serif">
<text x="38" y="42" fill="#94a3b8" font-size="12" letter-spacing="1.3">THE MELBOURNE EXAMPLE</text>
<text x="38" y="79" fill="#f8fafc" font-size="25" font-weight="600">Different searches. A possible next step.</text>
<g fill="#11131a" stroke="#333641"><rect x="38" y="113" width="290" height="108" rx="9"/><rect x="38" y="241" width="290" height="125" rx="9"/><rect x="405" y="162" width="250" height="163" rx="9"/><rect x="737" y="190" width="225" height="107" rx="9"/></g>
<g fill="none" stroke="#ff304f" stroke-width="2" marker-end="url(#arrow)"><path d="M328 165h31v54h42"/><path d="M328 301h31v-39h42"/><path d="M655 244h76" stroke-dasharray="5 6"/></g>
<text x="58" y="144" fill="#ff304f" font-size="12" font-weight="600">GOOGLE SEARCH</text>
<g fill="#e2e6ed" font-size="17"><text x="58" y="174">“commercial office cleaning</text><text x="58" y="198">Melbourne”</text></g>
<text x="58" y="272" fill="#ff304f" font-size="12" font-weight="600">AI SEARCH</text>
<g fill="#e2e6ed" font-size="17"><text x="58" y="302">What should I check before</text><text x="58" y="326">hiring an office cleaner?</text></g>
<text x="426" y="197" fill="#f8fafc" font-size="19" font-weight="600">Check the business</text>
<g fill="#b3bccb" font-size="16"><text x="426" y="232">Does it cover our area?</text><text x="426" y="259">What is included?</text><text x="426" y="286">Can it work after hours?</text></g>
<text x="759" y="225" fill="#f8fafc" font-size="19" font-weight="600">Ask for a quote</text>
<g fill="#b3bccb" font-size="15"><text x="759" y="253">If the service looks suitable,</text><text x="759" y="276">send the details of the job.</text></g>
<path d="M38 397h924" stroke="#292c36"/>
<text x="38" y="427" fill="#94a3b8" font-size="13">Hypothetical example · Melbourne office cleaning</text>
</g></svg>
