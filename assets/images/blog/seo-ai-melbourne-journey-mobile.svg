<svg xmlns="http://www.w3.org/2000/svg" width="540" height="750" viewBox="0 0 540 750" role="img" aria-labelledby="title desc">
<title id="title">A possible journey from finding an office cleaner to requesting a quote</title>
<desc id="desc">Google search or an AI search may lead a customer to check a Melbourne cleaning business's coverage, scope and after-hours service, then ask for a quote if suitable. This is a hypothetical example.</desc>
<defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="m1 1 6 3-6 3" fill="none" stroke="#ff304f" stroke-width="1.3"/></marker></defs>
<rect width="540" height="750" rx="16" fill="#0a0b10"/>
<g font-family="Inter, Arial, sans-serif">
<text x="30" y="39" fill="#94a3b8" font-size="13" letter-spacing="1">THE MELBOURNE EXAMPLE</text>
<g fill="#f8fafc" font-size="27" font-weight="600"><text x="30" y="78">Different searches.</text><text x="30" y="111">A possible next step.</text></g>
<g fill="#11131a" stroke="#333641"><rect x="30" y="143" width="480" height="100" rx="9"/><rect x="30" y="259" width="480" height="100" rx="9"/><rect x="30" y="408" width="480" height="136" rx="9"/><rect x="30" y="591" width="480" height="88" rx="9"/></g>
<g fill="none" stroke="#ff304f" stroke-width="2" marker-end="url(#arrow)"><path d="M270 359v42"/><path d="M270 544v40" stroke-dasharray="5 6"/></g>
<text x="50" y="173" fill="#ff304f" font-size="14" font-weight="600">GOOGLE SEARCH</text>
<g fill="#e2e6ed" font-size="21"><text x="50" y="204">“commercial office cleaning Melbourne”</text></g>
<text x="50" y="289" fill="#ff304f" font-size="14" font-weight="600">AI SEARCH</text>
<g fill="#e2e6ed" font-size="21"><text x="50" y="320">What should I check before hiring</text><text x="50" y="346">an office cleaner?</text></g>
<text x="292" y="386" fill="#94a3b8" font-size="11">EITHER SEARCH MAY LEAD TO</text>
<text x="50" y="440" fill="#f8fafc" font-size="23" font-weight="600">Check the business</text>
<g fill="#b3bccb" font-size="20"><text x="50" y="472">Does it cover our area?</text><text x="50" y="500">What is included?</text><text x="50" y="528">Can it work after hours?</text></g>
<text x="50" y="625" fill="#f8fafc" font-size="23" font-weight="600">Ask for a quote</text>
<text x="50" y="656" fill="#b3bccb" font-size="18">If suitable, send the details of the job.</text>
<text x="30" y="721" fill="#94a3b8" font-size="14">Hypothetical example · Melbourne office cleaning</text>
</g></svg>
