<svg xmlns="http://www.w3.org/2000/svg" width="540" height="1080" viewBox="0 0 540 1080" role="img" aria-labelledby="title desc"><title id="title">Revenue, delivery costs and marketing costs in the hypothetical example</title><desc id="desc">Hypothetical AUD 7,500 recorded revenue consists of AUD 3,600 direct delivery costs, AUD 2,100 included marketing costs and AUD 1,800 before other costs. Revenue ROAS is 5 times media spend, not profit or proof of incremental impact. Amounts consistently exclude GST.</desc><rect width="100%" height="100%" fill="#11151a"/><g font-family="Arial,sans-serif" fill="#f7f6f2"><text x="30" y="46" font-size="18" letter-spacing="1" fill="#c4c7cd">HYPOTHETICAL · AUD · EX GST</text><text x="30" y="103" font-size="36" font-weight="700">AUD 7,500</text><text x="30" y="143" font-size="28">recorded revenue</text><text x="30" y="183" font-size="22" fill="#c4c7cd">Costs still have to come out.</text><rect x="30" y="218" width="230.4" height="70" fill="#56616d"/><rect x="260.4" y="218" width="134.4" height="70" fill="#b51c38"/><rect x="394.8" y="218" width="115.2" height="70" fill="#e5e6e4"/><rect x="30" y="330" width="480" height="136" fill="#1b2129"/><rect x="30" y="330" width="5" height="136" fill="#56616d"/><text x="54" y="365" font-size="24">Direct delivery costs</text><text x="54" y="408" font-size="34" font-weight="700">AUD 3,600</text><text x="54" y="442" font-size="22" fill="#c4c7cd">For the completed work</text><rect x="30" y="490" width="480" height="136" fill="#1b2129"/><rect x="30" y="490" width="5" height="136" fill="#b51c38"/><text x="54" y="525" font-size="24">Included marketing</text><text x="54" y="568" font-size="34" font-weight="700">AUD 2,100</text><text x="54" y="602" font-size="22" fill="#c4c7cd">1,500 media + 600 other</text><rect x="30" y="650" width="480" height="136" fill="#1b2129"/><rect x="30" y="650" width="5" height="136" fill="#e5e6e4"/><text x="54" y="685" font-size="24">Before other costs</text><text x="54" y="728" font-size="34" font-weight="700">AUD 1,800</text><text x="54" y="762" font-size="22" fill="#c4c7cd">Not net business profit</text><path d="M30 830H510" stroke="#4a535f"/><text x="30" y="876" font-size="26" font-weight="700">Revenue ROAS</text><text x="30" y="918" font-size="29">7,500 ÷ 1,500 = 5×</text><text x="30" y="961" font-size="23" fill="#c4c7cd">Revenue per media dollar.</text><text x="30" y="1001" font-size="23" fill="#c4c7cd">Not profit or proof of</text><text x="30" y="1034" font-size="23" fill="#c4c7cd">incremental impact.</text></g></svg>