<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="440" viewBox="0 0 1000 440" role="img" aria-labelledby="title desc"><title id="title">A click is only the start</title><desc id="desc">An illustrative sequence: a phone-button click, a connected call, a suitable enquiry, then a booking or accepted quote. Each stage needs its own evidence.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10" fill="#ff304f"/></marker></defs><g font-family="Arial, sans-serif"><rect x="1" y="1" width="998" height="438" rx="12" fill="#0c1017" stroke="#343944"/><text x="36" y="43" font-size="11" fill="#ff304f" font-weight="700" letter-spacing="2">FOLLOW THE ENQUIRY</text><text x="36" y="87" font-size="34" fill="#f8fafc" font-weight="700" >A click is only the start</text><text x="36" y="117" font-size="16" fill="#aeb8c6" font-weight="400" >Check what happens after someone taps the call button.</text><rect x="36" y="153" width="214" height="190" rx="7" fill="#121823" stroke="#ff304f"/><text x="52" y="182" font-size="12" fill="#ff304f" font-weight="700" letter-spacing="1">01</text><text x="52" y="220" font-size="24" fill="#f8fafc" font-weight="700" >Phone button</text><text x="52" y="248" font-size="24" fill="#f8fafc" font-weight="700" >clicked</text><text x="52" y="285" font-size="14" fill="#aeb8c6" font-weight="400" >Recorded in Business</text><text x="52" y="306" font-size="14" fill="#aeb8c6" font-weight="400" >Profile Performance</text><path d="M 255 244 H 270" fill="none" stroke="#ff304f" stroke-width="2" marker-end="url(#arrow)"/><rect x="274" y="153" width="214" height="190" rx="7" fill="#121823" stroke="#343944"/><text x="290" y="182" font-size="12" fill="#ff304f" font-weight="700" letter-spacing="1">02</text><text x="290" y="220" font-size="24" fill="#f8fafc" font-weight="700" >Call</text><text x="290" y="248" font-size="24" fill="#f8fafc" font-weight="700" >connected</text><text x="290" y="285" font-size="14" fill="#aeb8c6" font-weight="400" >Check call records and</text><text x="290" y="306" font-size="14" fill="#aeb8c6" font-weight="400" >whether the team answered.</text><path d="M 493 244 H 508" fill="none" stroke="#ff304f" stroke-width="2" marker-end="url(#arrow)"/><rect x="512" y="153" width="214" height="190" rx="7" fill="#121823" stroke="#343944"/><text x="528" y="182" font-size="12" fill="#ff304f" font-weight="700" letter-spacing="1">03</text><text x="528" y="220" font-size="24" fill="#f8fafc" font-weight="700" >Suitable</text><text x="528" y="248" font-size="24" fill="#f8fafc" font-weight="700" >enquiry</text><text x="528" y="285" font-size="14" fill="#aeb8c6" font-weight="400" >Confirm service, area</text><text x="528" y="306" font-size="14" fill="#aeb8c6" font-weight="400" >and availability.</text><path d="M 731 244 H 746" fill="none" stroke="#ff304f" stroke-width="2" marker-end="url(#arrow)"/><rect x="750" y="153" width="214" height="190" rx="7" fill="#121823" stroke="#343944"/><text x="766" y="182" font-size="12" fill="#ff304f" font-weight="700" letter-spacing="1">04</text><text x="766" y="220" font-size="24" fill="#f8fafc" font-weight="700" >Booking or</text><text x="766" y="248" font-size="24" fill="#f8fafc" font-weight="700" >accepted quote</text><text x="766" y="285" font-size="14" fill="#aeb8c6" font-weight="400" >Confirm in your</text><text x="766" y="306" font-size="14" fill="#aeb8c6" font-weight="400" >business records.</text><text x="36" y="391" font-size="16" fill="#aeb8c6" font-weight="400" >Illustrative route. Each stage needs evidence of its own.</text></g></svg>
