<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="640" viewBox="0 0 1000 640" role="img" aria-labelledby="title desc"><title id="title">Where the revenue goes in the hypothetical example</title><desc id="desc">Hypothetical AUD 7,500 recorded revenue consists of AUD 3,600 direct delivery costs, AUD 2,100 included marketing costs and AUD 1,800 before other costs. Revenue ROAS is 5 times media spend, not profit or proof of incremental impact. Amounts consistently exclude GST.</desc><rect width="100%" height="100%" fill="#11151a"/><g font-family="Arial,sans-serif" fill="#f7f6f2"><text x="50" y="54" font-size="17" letter-spacing="2" fill="#c4c7cd">HYPOTHETICAL EXAMPLE · AUD · EXCLUDING GST</text><text x="50" y="113" font-size="38" font-weight="700">AUD 7,500 recorded revenue</text><text x="50" y="151" font-size="21" fill="#c4c7cd">Delivery and marketing costs still have to come out of that amount.</text><rect x="50" y="190" width="432" height="86" fill="#56616d"/><rect x="482" y="190" width="252" height="86" fill="#b51c38"/><rect x="734" y="190" width="216" height="86" fill="#e5e6e4"/><rect x="50" y="320" width="280" height="133" fill="#1b2129"/><rect x="50" y="320" width="280" height="4" fill="#56616d"/><text x="68" y="358" font-size="21">Direct delivery costs</text><text x="68" y="400" font-size="30" font-weight="700">AUD 3,600</text><text x="68" y="430" font-size="18" fill="#c4c7cd">For the completed work</text><rect x="360" y="320" width="280" height="133" fill="#1b2129"/><rect x="360" y="320" width="280" height="4" fill="#b51c38"/><text x="378" y="358" font-size="21">Included marketing</text><text x="378" y="400" font-size="30" font-weight="700">AUD 2,100</text><text x="378" y="430" font-size="18" fill="#c4c7cd">1,500 media + 600 other</text><rect x="670" y="320" width="280" height="133" fill="#1b2129"/><rect x="670" y="320" width="280" height="4" fill="#e5e6e4"/><text x="688" y="358" font-size="21">Before other costs</text><text x="688" y="400" font-size="30" font-weight="700">AUD 1,800</text><text x="688" y="430" font-size="18" fill="#c4c7cd">Not net business profit</text><path d="M50 488H950" stroke="#4a535f"/><text x="50" y="530" font-size="25" font-weight="700">Revenue ROAS: 7,500 ÷ 1,500 = 5×</text><text x="50" y="568" font-size="21" fill="#c4c7cd">Revenue per dollar of media spend.</text><text x="50" y="603" font-size="21" fill="#c4c7cd">It does not measure profit or prove incremental impact.</text></g></svg>