<svg xmlns="http://www.w3.org/2000/svg" width="540" height="1160" viewBox="0 0 540 1160" role="img" aria-labelledby="title desc"><title id="title">Choose the check that fits the missing result</title><desc id="desc">Four diagnosis paths for one exact URL: outside the index, another URL selected, indexed with little visibility, and a recent decline. They can overlap and do not guarantee indexing or ranking.</desc><rect width="540" height="1160" fill="#f7f6f2"/><g font-family="Arial, sans-serif"><text x="28" y="44" font-size="26" font-weight="700" fill="#12161c">Start with the exact URL.</text><text x="28" y="77" font-size="22" fill="#53606c">Then choose the check that fits.</text><g transform="translate(25 110)"><rect width="490" height="215" rx="6" fill="#fff" stroke="#c8cdd0"/><rect width="5" height="215" fill="#b51c38"/><text x="23" y="35" fill="#b51c38" font-size="18" font-weight="700">01 / INVESTIGATE</text><text x="23" y="78" font-size="29" font-weight="700" fill="#12161c">Outside the index</text><text x="23" y="122" font-size="25" fill="#404c58">Read the reported reason.</text><text x="23" y="154" font-size="25" fill="#404c58">Check access and page purpose.</text></g><g transform="translate(25 345)"><rect width="490" height="215" rx="6" fill="#fff" stroke="#c8cdd0"/><rect width="5" height="215" fill="#b51c38"/><text x="23" y="35" fill="#b51c38" font-size="18" font-weight="700">02 / INVESTIGATE</text><text x="23" y="78" font-size="29" font-weight="700" fill="#12161c">Another URL selected</text><text x="23" y="122" font-size="25" fill="#404c58">Compare the selected version</text><text x="23" y="154" font-size="25" fill="#404c58">with the intended main page.</text></g><g transform="translate(25 580)"><rect width="490" height="215" rx="6" fill="#fff" stroke="#c8cdd0"/><rect width="5" height="215" fill="#b51c38"/><text x="23" y="35" fill="#b51c38" font-size="18" font-weight="700">03 / INVESTIGATE</text><text x="23" y="78" font-size="29" font-weight="700" fill="#12161c">Indexed, little visibility</text><text x="23" y="122" font-size="25" fill="#404c58">Review relevant searches</text><text x="23" y="154" font-size="25" fill="#404c58">and what the page explains.</text></g><g transform="translate(25 815)"><rect width="490" height="215" rx="6" fill="#fff" stroke="#c8cdd0"/><rect width="5" height="215" fill="#b51c38"/><text x="23" y="35" fill="#b51c38" font-size="18" font-weight="700">04 / INVESTIGATE</text><text x="23" y="78" font-size="29" font-weight="700" fill="#12161c">A recent decline</text><text x="23" y="122" font-size="25" fill="#404c58">Compare dates, affected pages</text><text x="23" y="154" font-size="25" fill="#404c58">and specific reported issues.</text></g><text x="28" y="1095" font-size="23" font-weight="700" fill="#12161c">These paths can overlap.</text><text x="28" y="1129" font-size="22" fill="#53606c">A successful check is not a ranking guarantee.</text></g></svg>