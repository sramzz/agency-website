<svg xmlns="http://www.w3.org/2000/svg" width="540" height="1010" viewBox="0 0 540 1010" role="img" aria-labelledby="title desc"><title id="title">Different searches need different pages</title><desc id="desc">A hypothetical Perth landscaping example. A service search leads to details of project types, service area, genuine work and an estimate request. A question about planning a low-maintenance garden leads to a guide with options and help preparing a project brief. These illustrate useful page purposes, not search results or promises.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10" fill="#ff304f"/></marker></defs><g font-family="Arial, sans-serif"><rect x="1" y="1" width="538" height="1008" rx="12" fill="#0c1017" stroke="#343944"/><text x="32" y="44" fill="#ff304f" font-size="14" font-weight="700">THE PERTH EXAMPLE</text><text x="32" y="91" fill="#f8fafc" font-size="32" font-weight="700">Different searches.</text><text x="32" y="132" fill="#f8fafc" font-size="32" font-weight="700">Different pages.</text><text x="32" y="171" fill="#94a3b8" font-size="21" font-weight="400">Match the page to what someone needs.</text><rect x="32" y="204" width="476" height="319" rx="8" fill="#121823" stroke="#343944"/><text x="54" y="238" fill="#ff304f" font-size="14" font-weight="700">01 / FIND A SERVICE</text><text x="54" y="280" fill="#f8fafc" font-size="25" font-weight="700">landscaping services</text><text x="54" y="313" fill="#f8fafc" font-size="25" font-weight="700">Perth</text><path d="M56 333 V361" stroke="#ff304f" stroke-width="2" marker-end="url(#arrow)"/><text x="54" y="398" fill="#f8fafc" font-size="25" font-weight="700">A clear service page</text><text x="54" y="439" fill="#94a3b8" font-size="21" font-weight="400">Project types and service area</text><text x="54" y="475" fill="#94a3b8" font-size="21" font-weight="400">Genuine work and how to enquire</text><rect x="32" y="569" width="476" height="319" rx="8" fill="#121823" stroke="#343944"/><text x="54" y="603" fill="#ff304f" font-size="14" font-weight="700">02 / RESEARCH A QUESTION</text><text x="54" y="645" fill="#f8fafc" font-size="25" font-weight="700">how to plan a</text><text x="54" y="678" fill="#f8fafc" font-size="25" font-weight="700">low-maintenance garden</text><path d="M56 698 V726" stroke="#ff304f" stroke-width="2" marker-end="url(#arrow)"/><text x="54" y="763" fill="#f8fafc" font-size="25" font-weight="700">A useful planning guide</text><text x="54" y="804" fill="#94a3b8" font-size="21" font-weight="400">Options to consider</text><text x="54" y="840" fill="#94a3b8" font-size="21" font-weight="400">Help preparing a project brief</text><text x="32" y="940" fill="#94a3b8" font-size="20" font-weight="400">Hypothetical example. Page purposes,</text><text x="32" y="970" fill="#94a3b8" font-size="20" font-weight="400">not rankings or promised results.</text></g></svg>