<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex, nofollow">
    <title>Opening WhatsApp…</title>
    <style>
      :root { color-scheme: dark; font-family: Inter, system-ui, sans-serif; }
      body { min-height: 100vh; min-height: 100dvh; margin: 0; display: grid; place-items: center; background: #050609; color: #f8fafc; }
      main { display: grid; justify-items: center; gap: 18px; padding: 28px; text-align: center; }
      .spinner { width: 44px; height: 44px; border: 4px solid rgba(248,250,252,.22); border-top-color: #ff304f; border-radius: 50%; animation: spin .8s linear infinite; }
      h1 { margin: 0; font-size: clamp(1.35rem, 6vw, 2rem); }
      p { margin: 0; color: #94a3b8; }
      @keyframes spin { to { transform: rotate(360deg); } }
      @media (prefers-reduced-motion: reduce) { .spinner { animation-duration: 1.8s; } }
    </style>
    <script>window.opener = null;</script>
  </head>
  <body>
    <main role="status" aria-live="polite">
      <div class="spinner" aria-hidden="true"></div>
      <h1>Opening WhatsApp…</h1>
      <p>We’re securely saving your details.</p>
    </main>
  </body>
</html>
